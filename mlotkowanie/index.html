button{font-family:inherit}
body{display:flex}
#game{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;cursor:none;touch-action:none}
#hud{position:absolute;left:14px;top:12px;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#bp{font-size:clamp(16px,3vw,26px);font-weight:900;color:var(--gold);line-height:1}
#info{font-size:9px;line-height:1.6;opacity:.95;margin-top:8px}
#combo{font-size:14px;font-weight:900;color:#fff;margin-top:6px;min-height:28px}
#shop{width:340px;font-size:9px;line-height:1.5;background:var(--paper);color:var(--ink);padding:12px;overflow-y:auto;border-left:6px solid var(--wood)}
#shop h2{margin:0 0 10px;font-size:14px}
.up{display:block;width:100%;text-align:left;margin:0 0 8px;padding:9px 10px;border:3px solid var(--ink);border-radius:0;font-size:9px;box-shadow:3px 3px 0 var(--ink);background:#fff8e6;color:var(--ink);font:inherit;cursor:pointer}
.up b{display:flex;justify-content:space-between;gap:6px}
.up small{display:block;opacity:.8;margin-top:6px;font-size:8px;line-height:1.6}
.up:disabled{opacity:.45;cursor:not-allowed}
.up:not(:disabled):hover{background:#ffe9a8}
#rebirth{background:var(--red);color:#fff;border-color:#7d1712}
#rebirth:not(:disabled):hover{background:#ef4a40}
.bar{height:8px;background:#0002;border-radius:0;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
#god{position:fixed;left:50%;top:50%;width:min(60vw,340px);transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:9;filter:drop-shadow(0 0 40px #ffe28a)}
#god.go{animation:fly 3.2s ease-in forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-190vh) scale(.8)}}
#flash{position:fixed;inset:0;background:radial-gradient(#fff9d6,#ffd96688 50%,transparent 75%);opacity:0;pointer-events:none;z-index:8}
#flash.go{animation:fl 3.2s ease-out forwards}
@keyframes fl{0%{opacity:0}20%{opacity:.8}100%{opacity:0}}
@media(max-width:760px){body{flex-direction:column}#shop{width:100%;height:44%;border-left:0;border-top:6px solid var(--wood)}}
@media(prefers-reduced-motion:reduce){#god.go,#flash.go{animation-duration:1s}}
</style>

</div>

SKINS.forEach(s=>{s.img=new Image();s.img.src=s.src});

const DEFS={
  dmg:{n:"Mocniejszy młotek",d:"+1 BP za uderzenie",base:10,g:1.15},
  crit:{n:"Trafienie krytyczne",d:"+2% szansy na x5 (max 50%)",base:60,g:1.3},
  combo:{n:"Siła combo",d:"Mocniejsze combo przy seriach",base:120,g:1.35},
  auto:{n:"Pomocnik z młotkiem",d:"+0,5 uderzenia na sekundę",base:80,g:1.28},
  gold:{n:"Złoty młotek",d:"+10% do wszystkich BP",base:400,g:1.5}
};
const SAVE="pawelMlotekV1";
let S={bp:0,rb:0,up:{dmg:0,crit:0,combo:0,auto:0,gold:0}};
try{const l=JSON.parse(localStorage.getItem(SAVE));if(l&&l.up)S=Object.assign(S,l)}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}};

const cap=()=>20+10*S.rb;
const cost=k=>Math.floor(DEFS[k].base*Math.pow(DEFS[k].g,S.up[k]));
const rbMult=()=>1+0.6*S.rb;
const rbCost=()=>Math.floor(10000*Math.pow(3.5,S.rb));
const comboStep=()=>0.01+0.005*S.up.combo;
let combo=0,comboT=0;
function hitValue(useCombo){
  let v=(1+S.up.dmg)*(1+0.1*S.up.gold)*rbMult();
  if(useCombo)v*=1+Math.min(combo,25)*comboStep();
  return v;
}
const fmt=n=>{n=Math.floor(n);if(n<1e3)return""+n;const u=["K","M","B","T","Qa"];let i=-1;let x=n;while(x>=1000&&i<u.length-1){x/=1000;i++}return x.toFixed(x<10?2:x<100?1:0)+u[i]};

/* ---------- shop ---------- */
const upsEl=document.getElementById("ups"),btns={};
for(const k in DEFS){
  const b=document.createElement("button");b.className="up";
  b.innerHTML=`<b><span class="t"></span><span class="p"></span></b><small></small>`;
  b.onclick=()=>{
    if(S.up[k]>=cap()||S.bp<cost(k))return;
    S.bp-=cost(k);S.up[k]++;save();refresh();
  };
  upsEl.appendChild(b);btns[k]=b;
}
const rbBtn=document.getElementById("rebirth");
rbBtn.onclick=()=>{
  if(S.bp<rbCost())return;
  if(!confirm("Rebirth zresetuje BP i upgrady, ale da trwały mnożnik x"+(1+0.6*(S.rb+1)).toFixed(1)+" i wyższy limit upgradów. Robimy?"))return;
  S.rb++;S.bp=0;for(const k in S.up)S.up[k]=0;save();playRebirth();refresh();
};
function refresh(){
  for(const k in DEFS){
    const b=btns[k],lv=S.up[k],max=lv>=cap();
    b.querySelector(".t").textContent=`${DEFS[k].n} (${lv}/${cap()})`;
    b.querySelector(".p").textContent=max?"MAX":fmt(cost(k))+" BP";
    let extra="";
    if(k==="crit")extra=` Teraz: ${Math.min(50,2*lv)}%`;
    if(k==="auto")extra=` Teraz: ${(0.5*lv).toFixed(1)}/s`;
    if(k==="dmg")extra=` Teraz: ${fmt(hitValue(false))} BP/hit`;
    b.querySelector("small").textContent=DEFS[k].d+"."+extra;
    b.disabled=max||S.bp<cost(k);
  }
  document.getElementById("bp").textContent=fmt(S.bp)+" BPpoints";
  document.getElementById("info").textContent=`Rebirthy: ${S.rb} · mnożnik x${rbMult().toFixed(1)} · ${fmt(hitValue(false))} BP/hit`;
  document.getElementById("rbcost").textContent=fmt(rbCost())+" BP";
  document.getElementById("rbdesc").textContent=`Mnożnik x${rbMult().toFixed(1)} → x${(rbMult()+0.6).toFixed(1)}, limit upgradów ${cap()} → ${cap()+10}. Resetuje BP i upgrady.`;
  document.getElementById("rbbar").style.width=Math.min(100,S.bp/rbCost()*100)+"%";
  rbBtn.disabled=S.bp<rbCost();
}
function playRebirth(){
  const g=document.getElementById("god"),f=document.getElementById("flash");
  g.classList.remove("go");f.classList.remove("go");void g.offsetWidth;
  g.classList.add("go");f.classList.add("go");
}

/* ---------- game ---------- */
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,floorY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  floorY=H*0.84;
}
addEventListener("resize",resize);resize();

const P={x:0,y:0,vx:0,vy:0,a:0,va:0,w:100,h:200,grab:false,gx:0,gy:0,skin:-1};
function sizeBody(){
  const sk=SKINS[S.rb%SKINS.length];
  if(P.skin===S.rb%SKINS.length)return;
  P.skin=S.rb%SKINS.length;P.ready=!!sk.img.naturalWidth;
  const im=sk.img,ar=(im.naturalWidth*sk.crop[2])/(im.naturalHeight*sk.crop[3])||0.6;
  let h=Math.min(H*0.38,360),w=h*ar;
  if(w>Math.min(W*0.4,340)){w=Math.min(W*0.4,340);h=w/ar}
  if(P.y>0)P.y=Math.min(P.y,floorY-h/2-5);
  P.w=w;P.h=h;
}
function reset(){P.x=W/2;P.y=floorY-P.h/2-5;P.vx=P.vy=P.a=P.va=0}
let started=true;let inRoom=false;

const pop=[],ptr={x:W/2,y:H/2,px:0,py:0,sp:0,swing:0};

function inside(x,y){
  const dx=x-P.x,dy=y-P.y,c=Math.cos(-P.a),s=Math.sin(-P.a);
  const lx=dx*c-dy*s,ly=dx*s+dy*c;
  return Math.abs(lx)<=P.w/2&&Math.abs(ly)<=P.h/2?{lx,ly}:null;
}
function hit(x,y,auto){
  if(!auto){combo++;comboT=1.6}
  let v=hitValue(!auto),crit=false;
  if(Math.random()<Math.min(.5,.02*S.up.crit)){v*=5;crit=true}
  S.bp+=v;
  pop.push({x,y,t:0,txt:(crit?"KRYT! +":"+")+fmt(v),crit});
  let dx=P.x-x,dy=P.y-y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const f=(auto?520:700)*(crit?1.5:1);
  P.vx+=dx*f+(Math.random()-.5)*120;P.vy+=dy*f-260;
  const cr=(x-P.x)*dy-(y-P.y)*dx;
  P.va+=(cr/(P.h/2))*5*(crit?1.4:1)+(Math.random()-.5)*2;
  ptr.swing=1;
  if(Math.random()<.4)refresh();
}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  inRoom=true;const p=pos(e);ptr.x=p.x;ptr.y=p.y;ptr.px=p.x;ptr.py=p.y;ptr.swing=1;
  const h=inside(p.x,p.y);
  if(h){hit(p.x,p.y,false);P.grab=true;P.gx=p.x-P.x;P.gy=p.y-P.y}
});
cv.addEventListener("pointermove",e=>{const p=pos(e);ptr.x=p.x;ptr.y=p.y});
const release=()=>{P.grab=false};
cv.addEventListener("pointerenter",e=>{inRoom=true;const p=pos(e);ptr.x=p.x;ptr.y=p.y});
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!P.grab)inRoom=false});
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",release);

let last=performance.now(),autoT=0,tick=0;
function step(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(P.skin!==S.rb%SKINS.length||P.ready!==!!SKINS[S.rb%SKINS.length].img.naturalWidth){P.skin=-1;sizeBody();if(!P.init){reset();P.init=true}}
  if(started){
    if(P.grab){
      const tx=ptr.x-P.gx,ty=ptr.y-P.gy;
      P.vx=(tx-P.x)*12;P.vy=(ty-P.y)*12;P.va*=.92;
      P.a+=(0-P.a)*Math.min(1,dt*1.5);
    }else P.vy+=1500*dt;
    const m=900;P.vx=Math.max(-m*2,Math.min(m*2,P.vx));P.vy=Math.max(-m*2,Math.min(m*2,P.vy));
    P.x+=P.vx*dt;P.y+=P.vy*dt;P.a+=P.va*dt;P.va*=Math.pow(.6,dt);P.vx*=Math.pow(.8,dt);
    const hw=Math.abs(Math.cos(P.a))*P.w/2+Math.abs(Math.sin(P.a))*P.h/2;
    const hh=Math.abs(Math.sin(P.a))*P.w/2+Math.abs(Math.cos(P.a))*P.h/2;
    if(P.x<hw){P.x=hw;P.vx=Math.abs(P.vx)*.6;P.va*=.8}
    if(P.x>W-hw){P.x=W-hw;P.vx=-Math.abs(P.vx)*.6;P.va*=.8}
    if(P.y>floorY-hh+hh*0.1){P.y=floorY-hh+hh*0.1;if(Math.abs(P.vy)>80)P.vy=-P.vy*.45;else P.vy=0;P.vx*=.92;P.va*=.9}
    if(P.y<hh){P.y=hh;P.vy=Math.abs(P.vy)*.5}
    /* upright slightly when resting */
    if(!P.grab&&P.y>floorY-hh)P.a+=(0-P.a)*Math.min(1,dt*0.8);
    if(S.up.auto>0){
      autoT+=dt;const iv=1/(0.5*S.up.auto);
      while(autoT>=iv){autoT-=iv;hit(P.x+(Math.random()-.5)*P.w*.6,P.y+(Math.random()-.5)*P.h*.6,true)}
    }
    if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
    tick+=dt;if(tick>.25){tick=0;refresh()}
  }
  document.getElementById("combo").textContent=combo>1?`Combo x${combo}`:"";
  ptr.swing=Math.max(0,ptr.swing-dt*5);
  draw();requestAnimationFrame(step);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawRoom(){
  const g=ctx.createLinearGradient(0,0,0,floorY);g.addColorStop(0,"#d9b98a");g.addColorStop(1,"#c49a68");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,floorY);
  ctx.fillStyle="rgba(120,70,30,.12)";
  for(let x=0;x<W;x+=46)ctx.fillRect(x,0,22,floorY);
  /* poster */
  const pw=Math.min(150,W*.28),ph=pw*1.15,px=W/2-pw/2,py=H*.1;
  ctx.fillStyle="#2a1d14";ctx.fillRect(px-6,py-6,pw+12,ph+12);
  ctx.fillStyle="#f6e7c8";ctx.fillRect(px,py,pw,ph);
  ctx.fillStyle="#d6342c";ctx.fillRect(px,py,pw,ph*.22);
  ctx.textAlign="center";ctx.fillStyle="#2a1d14";
  const fs=Math.max(8,Math.floor(pw/11));ctx.font=fs+'px "Press Start 2P",monospace';
  ctx.fillText("BP Club",W/2,py+ph*.55);ctx.fillText("Kowala",W/2,py+ph*.55+fs*2);
  /* floor */
  ctx.fillStyle="#7a4a26";ctx.fillRect(0,floorY,W,H-floorY);
  ctx.fillStyle="#5a3418";ctx.fillRect(0,floorY,W,8);
  ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=2;
  for(let y=floorY+8+(H-floorY-8)/3;y<H;y+=(H-floorY-8)/3){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawBody(){
  const sk=SKINS[S.rb%SKINS.length],im=sk.img;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(P.x,floorY+6,P.w*.5*Math.max(.4,1-(floorY-P.y)/H),9,0,0,7);ctx.fill();
  ctx.translate(P.x,P.y);ctx.rotate(P.a);
  ctx.fillStyle="#fff";rr(-P.w/2-6,-P.h/2-6,P.w+12,P.h+12,14);ctx.fill();
  ctx.save();rr(-P.w/2,-P.h/2,P.w,P.h,10);ctx.clip();
  if(im.complete&&im.naturalWidth){
    const c=sk.crop,iw=im.naturalWidth,ih=im.naturalHeight;
    ctx.drawImage(im,c[0]*iw,c[1]*ih,c[2]*iw,c[3]*ih,-P.w/2,-P.h/2,P.w,P.h);
  }
  ctx.restore();ctx.restore();
}
function drawHammer(){
  const sw=ptr.swing;
  ctx.save();ctx.translate(ptr.x,ptr.y);ctx.rotate(-0.7+sw*1.5);
  ctx.fillStyle="#8a5a2b";ctx.fillRect(-6,-10,12,110);
  ctx.strokeStyle="#2a1d14";ctx.lineWidth=3;ctx.strokeRect(-6,-10,12,110);
  ctx.fillStyle=S.rb>0?"#f2b63d":"#9aa3ad";rr(-38,-50,76,42,6);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.4)";ctx.fillRect(-32,-44,60,8);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);drawRoom();
  if(started)drawBody();
  for(let i=pop.length-1;i>=0;i--){
    const p=pop[i];p.t+=.016;
    if(p.t>.9){pop.splice(i,1);continue}
    ctx.globalAlpha=1-p.t/.9;ctx.textAlign="center";
    ctx.font=`${p.crit?20:14}px "Press Start 2P",monospace`;
    ctx.lineWidth=5;ctx.strokeStyle="#2a1d14";ctx.fillStyle=p.crit?"#ff6a4d":"#ffe28a";
    const y=p.y-p.t*90;ctx.strokeText(p.txt,p.x,y);ctx.fillText(p.txt,p.x,y);ctx.globalAlpha=1;
  }
  if(inRoom)drawHammer();
}
refresh();
requestAnimationFrame(step);
</script>
</body>
</html>
