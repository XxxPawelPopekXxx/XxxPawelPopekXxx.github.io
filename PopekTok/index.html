<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komentarze PopekTok z logowaniem</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; }
        .panel { background: #f4f4f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .btn-secondary { background-color: #6c757d; }
        .btn-danger { background-color: #dc3545; }
        #message { margin-top: 10px; font-weight: bold; }
        .comment { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .comment-author { font-weight: bold; color: #007bff; }
        .comment-date { font-size: 0.8em; color: #777; }
        
        /* Klasy do ukrywania elementów */
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>System Komentarzy</h2>
    <div id="message"></div>

    <div id="authPanel" class="panel">
        <h3>Zaloguj się lub stwórz konto</h3>
        <input type="text" id="nickInput" placeholder="Twój Nick (tylko przy rejestracji)">
        <input type="email" id="emailInput" placeholder="Adres E-mail">
        <input type="password" id="passwordInput" placeholder="Hasło (min. 6 znaków)">
        
        <button id="loginBtn">Zaloguj się</button>
        <button id="registerBtn" class="btn-secondary">Zarejestruj się</button>
    </div>

    <div id="userPanel" class="panel hidden">
        Zalogowano jako: <strong id="currentUserDisplay"></strong>
        <button id="logoutBtn" class="btn-danger" style="float: right; padding: 5px 10px;">Wyloguj</button>
        <div style="clear: both;"></div>
    </div>

    <div id="commentPanel" class="panel hidden">
        <textarea id="commentInput" placeholder="Napisz coś..."></textarea>
        <button id="submitBtn">Wyślij komentarz</button>
    </div>

    <div id="commentsList" class="panel">
        <h3>Komentarze:</h3>
        <div id="commentsContainer">Ładowanie komentarzy...</div>
    </div>

    <script type="module">
        // Importy Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Konfiguracja
        const firebaseConfig = {
            apiKey: "AIzaSyBnxvLaH6HF6gWqlJO9pCVaKvEC5eCrMzA",
            authDomain: "popektok.firebaseapp.com",
            projectId: "popektok",
            storageBucket: "popektok.firebasestorage.app",
            messagingSenderId: "805938481983",
            appId: "1:805938481983:web:755947062531b57e24618a"
        };

        // Inicjalizacja
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Elementy interfejsu
        const authPanel = document.getElementById('authPanel');
        const userPanel = document.getElementById('userPanel');
        const commentPanel = document.getElementById('commentPanel');
        const currentUserDisplay = document.getElementById('currentUserDisplay');
        const commentsContainer = document.getElementById('commentsContainer');
        const messageDiv = document.getElementById('message');

        const COOLDOWN_TIME = 60 * 1000; // 1 minuta

        // --- SYSTEM KOMUNIKATÓW ---
        function showMessage(text, color) {
            messageDiv.textContent = text;
            messageDiv.style.color = color;
            setTimeout(() => { messageDiv.textContent = ''; }, 5000);
        }

        // --- NASŁUCHIWANIE STANU ZALOGOWANIA ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Użytkownik zalogowany - pokaż panele
                authPanel.classList.add('hidden');
                userPanel.classList.remove('hidden');
                commentPanel.classList.remove('hidden');
                currentUserDisplay.textContent = user.displayName || "Anonim";
            } else {
                // Użytkownik wylogowany - ukryj panele
                authPanel.classList.remove('hidden');
                userPanel.classList.add('hidden');
                commentPanel.classList.add('hidden');
            }
        });

        // --- REJESTRACJA ---
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const nick = document.getElementById('nickInput').value;

            if (!nick) return showMessage("Podaj Nick do rejestracji!", "red");

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // Zaktualizuj profil o podany nick
                await updateProfile(userCredential.user, { displayName: nick });
                showMessage("Konto utworzone pomyślnie!", "green");
                // Odśwież widok nicku
                currentUserDisplay.textContent = nick;
            } catch (error) {
                showMessage("Błąd rejestracji: " + error.message, "red");
            }
        });

        // --- LOGOWANIE ---
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage("Zalogowano pomyślnie!", "green");
            } catch (error) {
                showMessage("Błąd logowania: zły e-mail lub hasło.", "red");
            }
        });

        // --- WYLOGOWANIE ---
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                showMessage("Wylogowano.", "green");
            });
        });

        // --- COOLDOWN (Sprawdzanie) ---
        function checkCooldown() {
            const lastCommentTime = localStorage.getItem('lastCommentTime');
            if (!lastCommentTime) return true;

            const timePassed = Date.now() - parseInt(lastCommentTime);
            if (timePassed >= COOLDOWN_TIME) {
                return true;
            } else {
                const timeLeft = Math.ceil((COOLDOWN_TIME - timePassed) / 1000);
                showMessage(`Poczekaj jeszcze ${timeLeft} sekund.`, 'red');
                return false;
            }
        }

        // --- DODAWANIE KOMENTARZA ---
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.addEventListener('click', async () => {
            const text = document.getElementById('commentInput').value.trim();
            const user = auth.currentUser; // Pobierz aktualnie zalogowanego użytkownika

            if (!user) return showMessage("Musisz być zalogowany!", "red");
            if (text === "") return showMessage("Komentarz nie może być pusty!", "red");
            if (!checkCooldown()) return;

            try {
                submitBtn.disabled = true;
                
                // Zapisujemy komentarz z danymi autora
                await addDoc(collection(db, "comments"), {
                    text: text,
                    authorName: user.displayName || "Anonim",
                    authorUid: user.uid,
                    createdAt: serverTimestamp()
                });

                localStorage.setItem('lastCommentTime', Date.now().toString());
                document.getElementById('commentInput').value = "";
                showMessage("Komentarz dodany!", "green");

            } catch (error) {
                showMessage("Błąd: " + error.message, "red");
            } finally {
                submitBtn.disabled = false;
            }
        });

        // --- POBIERANIE I WYŚWIETLANIE KOMENTARZY (Na żywo) ---
        const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            commentsContainer.innerHTML = ""; // Wyczyść kontener
            
            if (snapshot.empty) {
                commentsContainer.innerHTML = "<p>Brak komentarzy. Bądź pierwszy!</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement("div");
                div.className = "comment";
                
                // Formatowanie daty, jeśli istnieje
                let dateString = "Wysyłanie...";
                if (data.createdAt) {
                    const date = data.createdAt.toDate();
                    dateString = date.toLocaleDateString() + " " + date.toLocaleTimeString();
                }

                div.innerHTML = `
                    <div class="comment-author">${data.authorName} <span class="comment-date">(${dateString})</span></div>
                    <div class="comment-text">${data.text}</div>
                `;
                commentsContainer.appendChild(div);
            });
        });
    </script>
</body>
</html>
