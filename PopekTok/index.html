<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #010101;
            --tiktok-red: #ff0050;
            --tiktok-cyan: #00f2ea;
            --text-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            font-family: 'ProximaNova', sans-serif;
            overflow: hidden;
            color: var(--text-white);
        }

        /* Video Container */
        #video-container {
            width: 100%;
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }

        #video-container::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome */

        .video-player {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video, .fallback-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* UI Overlays */
        .ui-overlay {
            position: absolute;
            bottom: 80px;
            left: 15px;
            z-index: 10;
        }

        .side-bar {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            font-size: 30px;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .icon-btn:active { transform: scale(0.9); }
        .liked { color: var(--tiktok-red); }

        /* Navigation */
        .nav-tabs {
            position: fixed;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-weight: bold;
            z-index: 20;
            opacity: 0.8;
        }

        .nav-item { cursor: pointer; }
        .active-tab { border-bottom: 2px solid white; }

        /* Bottom Menu */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: black;
            border-top: 0.5px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <span class="nav-item active-tab" onclick="showFeed()">For You</span>
        <span class="nav-item" onclick="showLiked()">Liked</span>
    </div>

    <div id="video-container">
        </div>

    <div class="bottom-menu">
        <i class="fas fa-home" onclick="showFeed()"></i>
        <i class="fas fa-heart" onclick="showLiked()"></i>
    </div>

    <script>
        const container = document.getElementById('video-container');
        const TOTAL_VIDEOS = 300;
        let likedVideos = JSON.parse(localStorage.getItem('likedVideos')) || [];
        let lastWatched = parseInt(localStorage.getItem('lastWatched')) || 1;

        async function initFeed() {
            container.innerHTML = '';
            // Generate videos from the last watched index forward
            for (let i = lastWatched; i <= TOTAL_VIDEOS; i++) {
                addVideoToDOM(i);
            }
        }

        function addVideoToDOM(index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-player';
            wrapper.dataset.index = index;

            const isLiked = likedVideos.includes(index) ? 'liked' : '';

            wrapper.innerHTML = `
                <video id="vid-${index}" loop playsinline preload="metadata" onplay="saveProgress(${index})">
                    <source src="video${index}.mp4" type="video/mp4">
                </video>
                <div class="side-bar">
                    <i class="fas fa-heart icon-btn ${isLiked}" onclick="toggleLike(${index}, this)"></i>
                    <i class="fas fa-comment icon-btn"></i>
                    <i class="fas fa-share icon-btn"></i>
                </div>
                <div class="ui-overlay">
                    <h4>@Creator</h4>
                    <p>This is video description #${index} #premium</p>
                </div>
            `;

            const videoElement = wrapper.querySelector('video');

            // Handle missing video file
            videoElement.onerror = function() {
                this.parentElement.innerHTML = `
                    <img src="image2.png" class="fallback-img">
                    <div class="side-bar">
                        <i class="fas fa-heart icon-btn ${isLiked}" onclick="toggleLike(${index}, this)"></i>
                    </div>
                    <div class="ui-overlay"><h4>Video ${index} missing</h4></div>
                `;
            };

            container.appendChild(wrapper);
        }

        // Logic to track scroll and save progress
        function saveProgress(index) {
            localStorage.setItem('lastWatched', index);
        }

        function toggleLike(index, el) {
            if (likedVideos.includes(index)) {
                likedVideos = likedVideos.filter(id => id !== index);
                el.classList.remove('liked');
            } else {
                likedVideos.push(index);
                el.classList.add('liked');
            }
            localStorage.setItem('likedVideos', JSON.stringify(likedVideos));
        }

        function showLiked() {
            container.innerHTML = '';
            if (likedVideos.length === 0) {
                container.innerHTML = '<div class="video-player"><h1>No Liked Videos</h1></div>';
                return;
            }
            likedVideos.forEach(id => addVideoToDOM(id));
            document.querySelectorAll('.nav-item')[1].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[0].classList.remove('active-tab');
        }

        function showFeed() {
            document.querySelectorAll('.nav-item')[0].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[1].classList.remove('active-tab');
            initFeed();
        }

        // Intersection Observer to Auto-play/Pause videos
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (video) {
                    if (entry.isIntersecting) {
                        video.play();
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                }
            });
        }, { threshold: 0.6 });

        // Update observer when new elements added
        const mutationObserver = new MutationObserver(() => {
            document.querySelectorAll('.video-player').forEach(v => observer.observe(v));
        });
        mutationObserver.observe(container, { childList: true });

        // On Load
        window.onload = initFeed;
    </script>
</body>
</html>
