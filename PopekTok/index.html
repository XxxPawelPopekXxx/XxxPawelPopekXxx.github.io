<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PopekTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --bg-black: #010101;
            --tiktok-red: #ff0050;
            --text-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0a; font-family: 'ProximaNova', sans-serif;
            color: var(--text-white); display: flex; justify-content: center; align-items: center;
        }

        #app-wrapper {
            position: relative; width: 100%; height: 100dvh;
            background-color: var(--bg-black); overflow: hidden;
        }

        @media (min-width: 768px) {
            #app-wrapper {
                height: 90vh; max-width: 400px; border-radius: 30px; 
                border: 8px solid #222; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            }
        }

        #video-container {
            width: 100%; height: 100%; scroll-snap-type: y mandatory;
            overflow-y: scroll; scrollbar-width: none; 
            overscroll-behavior-y: none; -webkit-overflow-scrolling: touch;
        }
        #video-container::-webkit-scrollbar { display: none; } 

        .video-player {
            width: 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; 
            position: relative; display: flex; align-items: center; justify-content: center;
            background: #000; overflow: hidden;
        }

        video, .fallback-img {
            width: 100%; height: 100%; object-fit: contain; cursor: pointer; z-index: 2;
        }

        .loader {
            position: absolute; width: 40px; height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            border-top-color: var(--text-white); animation: spin 1s ease-in-out infinite;
            z-index: 1; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .play-indicator {
            position: absolute; font-size: 80px; color: rgba(255, 255, 255, 0.6);
            pointer-events: none; opacity: 0; transition: opacity 0.2s ease; z-index: 5;
        }
        .is-paused .play-indicator { opacity: 1; }

        .floating-heart {
            position: absolute; color: var(--tiktok-red); font-size: 80px; pointer-events: none;
            transform: translate(-50%, -50%) scale(0); animation: popHeart 0.8s ease-out forwards;
            z-index: 15; text-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); }
            40% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); }
            100% { transform: translate(-50%, -150%) scale(1.5) rotate(0deg); opacity: 0; }
        }

        .ui-overlay { position: absolute; bottom: 80px; left: 15px; z-index: 10; pointer-events: none; }
        .side-bar { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; gap: 25px; align-items: center; z-index: 10; }
        .icon-btn { font-size: 32px; cursor: pointer; text-shadow: 0 0 10px rgba(0,0,0,0.8); transition: transform 0.2s; }
        .icon-btn:active { transform: scale(0.9); }
        .liked { color: var(--tiktok-red); }

        .nav-tabs { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; font-weight: bold; z-index: 20; text-shadow: 0 0 5px rgba(0,0,0,0.8); }
        .nav-item { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .active-tab { opacity: 1; border-bottom: 2px solid white; padding-bottom: 3px; }
        
        .bottom-menu { position: absolute; bottom: 0; width: 100%; height: 60px; background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; justify-content: space-around; align-items: center; z-index: 20; }

        /* Bottom Sheet (Modal) */
        .modal-sheet {
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 75%;
            background-color: #1a1a1a; border-top-left-radius: 15px; border-top-right-radius: 15px;
            z-index: 30; transition: bottom 0.3s ease-in-out; display: flex; flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }
        .modal-sheet.active { bottom: 0; }
        .modal-header { padding: 15px; text-align: center; border-bottom: 1px solid #333; position: relative; }
        .modal-header h3 { margin: 0; font-size: 16px; }
        .modal-header .fa-times { position: absolute; right: 20px; top: 15px; cursor: pointer; font-size: 20px; }
        
        /* Komentarze */
        .comment-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .comment-item { display: flex; gap: 10px; margin-bottom: 15px; background: #222; padding: 10px; border-radius: 10px; }
        .comment-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #444; }
        .comment-content { flex-grow: 1; }
        .comment-content strong { color: var(--tiktok-red); font-size: 12px; }
        .comment-content span.date { color: #888; font-size: 10px; margin-left: 5px; }
        .comment-content p { margin: 5px 0 0 0; font-size: 14px; word-break: break-word; }
        .comment-actions { margin-top: 8px; display: flex; gap: 15px; }
        .comment-actions span { color: #aaa; font-size: 11px; cursor: pointer; transition: color 0.2s; }
        .comment-actions span:hover { color: white; }
        .comment-actions .delete-btn { color: #ff4d4d; }

        /* Formularze */
        .auth-panel, .profile-panel { padding: 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; background: #111; }
        .auth-input { width: 100%; padding: 10px 15px; border-radius: 10px; border: none; background: #333; color: white; outline: none; box-sizing: border-box;}
        .auth-btn { padding: 10px; border-radius: 10px; border: none; background: var(--tiktok-red); color: white; cursor: pointer; font-weight: bold; flex-grow: 1;}
        
        .comment-input-area { padding: 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 5px; background: #111; }
        .input-row { display: flex; gap: 10px; align-items: center; width: 100%; }
        .input-row input { flex-grow: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #333; color: white; outline: none; }
        .send-btn { color: var(--tiktok-red); cursor: pointer; font-size: 24px; }
        .user-info-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; padding: 0 5px; align-items: center;}

        /* ADDED LINES: Override for PC to make it bigger while keeping aspect ratio */
        @media (min-width: 768px) {
            #app-wrapper {
                height: 95vh !important;
                max-width: 53.43vh !important; /* Force a 9:16 aspect ratio based on height */
                aspect-ratio: 9 / 16 !important;
            }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="nav-tabs">
            <span class="nav-item active-tab" onclick="showFeed()">For You</span>
            <span class="nav-item" onclick="showLiked()">Liked</span>
        </div>

        <div id="video-container"></div>

        <div class="bottom-menu">
            <i class="fas fa-home icon-btn" onclick="showFeed()" style="font-size: 24px;"></i>
            <i class="fas fa-heart icon-btn" onclick="showLiked()" style="font-size: 24px;"></i>
            <i class="fas fa-user icon-btn" onclick="openProfile()" style="font-size: 24px;"></i>
        </div>

        <!-- Modal Komentarzy -->
        <div id="comment-modal" class="modal-sheet">
            <div class="modal-header">
                <h3>Komentarze <span id="comment-count">(0)</span></h3>
                <i class="fas fa-times" onclick="closeModal('comment-modal')"></i>
            </div>
            
            <div id="comment-list" class="comment-list"></div>

            <div id="auth-panel" class="auth-panel">
                <div id="auth-msg" style="text-align: center; font-size: 13px; color: #ff4d4d;">Zaloguj się, aby komentować</div>
                <input type="text" id="auth-nick" class="auth-input" placeholder="Twój Nick (do rejestracji)">
                <input type="email" id="auth-email" class="auth-input" placeholder="Adres E-mail">
                <input type="password" id="auth-pass" class="auth-input" placeholder="Hasło (min. 6 znaków)">
                <div style="display: flex; gap: 10px;">
                    <button class="auth-btn" onclick="loginUser()">Zaloguj</button>
                    <button class="auth-btn" style="background: #444;" onclick="registerUser()">Zarejestruj</button>
                </div>
            </div>

            <div id="comment-input-area" class="comment-input-area" style="display: none;">
                <div class="user-info-row">
                    <span style="display: flex; align-items: center; gap: 5px;">
                        <img id="logged-user-avatar" src="image4.png" style="width:20px; height:20px; border-radius:50%;">
                        <strong id="logged-user-nick" style="color:white;"></strong>
                    </span>
                </div>
                <div class="input-row">
                    <input type="text" id="comment-input" placeholder="Dodaj komentarz..." onkeypress="handleEnter(event)">
                    <i class="fas fa-arrow-circle-up send-btn" onclick="addComment()"></i>
                </div>
            </div>
        </div>

        <!-- Modal Profilu -->
        <div id="profile-modal" class="modal-sheet">
            <div class="modal-header">
                <h3>Mój Profil</h3>
                <i class="fas fa-times" onclick="closeModal('profile-modal')"></i>
            </div>
            <div class="profile-panel" id="profile-settings" style="display: none;">
                <div style="text-align: center; margin-bottom: 10px;">
                    <img id="preview-avatar" src="image4.png" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom: 10px;">
                </div>
                <input type="text" id="update-nick" class="auth-input" placeholder="Nowa nazwa profilu">
                <input type="text" id="update-photo" class="auth-input" placeholder="Link do zdjęcia URL (np. imgur)">
                <button class="auth-btn" onclick="updateProfile()">Zapisz Zmiany</button>
                <button class="auth-btn" style="background: #444; margin-top: 15px;" onclick="logoutUser()">Wyloguj się</button>
            </div>
            <div class="profile-panel" id="profile-login-req" style="display: flex; justify-content: center; align-items: center; height: 100%;">
                <p>Musisz być zalogowany, aby edytować profil.</p>
                <button class="auth-btn" onclick="closeModal('profile-modal'); openComments(1);">Przejdź do logowania</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. KONFIGURACJA I ZMIENNE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBnxvLaH6HF6gWqlJO9pCVaKvEC5eCrMzA",
            authDomain: "popektok.firebaseapp.com",
            projectId: "popektok",
            storageBucket: "popektok.firebasestorage.app",
            messagingSenderId: "805938481983",
            appId: "1:805938481983:web:755947062531b57e24618a"
        };

        const ADMIN_UID = "RF1LMBT4FoenkaaJDHs2Y45um3s1"; // Wklej swój UID z Firebase Auth
        let db, auth; 

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth(); 
        } catch(e) { console.error("Firebase err"); }

        const container = document.getElementById('video-container');
        const TOTAL_VIDEOS = 300;
        let likedVideos = JSON.parse(localStorage.getItem('likedVideos')) || [];
        let lastWatched = parseInt(localStorage.getItem('lastWatched')) || 1;
        let isShowingLiked = false;
        let currentCommentVideoId = null;

        // Odczyt parametru z URL dla GitHub Pages (np. ?v=12)
        const urlParams = new URLSearchParams(window.location.search);
        const urlId = parseInt(urlParams.get('v'));
        if (!isNaN(urlId) && urlId > 0 && urlId <= TOTAL_VIDEOS) {
        lastWatched = urlId;
}

        // ==========================================
        // 2. LOGIKA KONT (AUTH & PROFILE)
        // ==========================================
        if(auth) {
            auth.onAuthStateChanged((user) => {
                const authPanel = document.getElementById('auth-panel');
                const commentInputArea = document.getElementById('comment-input-area');
                const profileSettings = document.getElementById('profile-settings');
                const profileLoginReq = document.getElementById('profile-login-req');

                if (user) {
                    authPanel.style.display = 'none';
                    commentInputArea.style.display = 'flex';
                    profileSettings.style.display = 'flex';
                    profileLoginReq.style.display = 'none';
                    
                    document.getElementById('logged-user-nick').innerText = user.displayName || "Użytkownik"; 
                    document.getElementById('logged-user-avatar').src = user.photoURL || "image4.png";
                    document.getElementById('preview-avatar').src = user.photoURL || "image4.png";
                    document.getElementById('update-nick').value = user.displayName || "";
                    document.getElementById('update-photo').value = user.photoURL || "";

                    if (currentCommentVideoId !== null) loadComments(currentCommentVideoId);
                } else {
                    authPanel.style.display = 'flex';
                    commentInputArea.style.display = 'none';
                    profileSettings.style.display = 'none';
                    profileLoginReq.style.display = 'flex';
                    if (currentCommentVideoId !== null) loadComments(currentCommentVideoId);
                }
            });
        }

        function registerUser() {
            const nick = document.getElementById('auth-nick').value.trim();
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value;

            if (!nick) { document.getElementById('auth-msg').innerText = "Podaj Nick!"; return; }

            auth.createUserWithEmailAndPassword(email, pass).then((cred) => {
                return cred.user.updateProfile({ displayName: nick, photoURL: "image4.png" });
            }).catch((error) => { document.getElementById('auth-msg').innerText = "Błąd: " + error.message; });
        }

        function loginUser() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value;
            auth.signInWithEmailAndPassword(email, pass).catch(() => {
                document.getElementById('auth-msg').innerText = "Błąd logowania.";
            });
        }

        function logoutUser() {
            auth.signOut();
            closeModal('profile-modal');
        }

        function updateProfile() {
            const user = auth.currentUser;
            if(!user) return;
            const newNick = document.getElementById('update-nick').value.trim();
            const newPhoto = document.getElementById('update-photo').value.trim() || "image4.png";

            user.updateProfile({
                displayName: newNick,
                photoURL: newPhoto
            }).then(() => {
                alert("Profil zaktualizowany!");
                document.getElementById('logged-user-nick').innerText = newNick;
                document.getElementById('logged-user-avatar').src = newPhoto;
                document.getElementById('preview-avatar').src = newPhoto;
            }).catch(e => alert("Błąd zapisu: " + e.message));
        }

        function openProfile() { document.getElementById('profile-modal').classList.add('active'); }
        function closeModal(id) { 
            document.getElementById(id).classList.remove('active'); 
            if(id === 'comment-modal') currentCommentVideoId = null;
        }

        // ==========================================
        // 3. OBSŁUGA WIDEO & FEED
        // ==========================================
        const loadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.classList.contains('empty')) {
                    renderVideoHTML(entry.target);
                }
            });
        }, { rootMargin: "100% 0px 100% 0px" });

        const playObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                const index = parseInt(entry.target.dataset.index);
                if (entry.isIntersecting) {
                    if (video) { video.play().catch(()=>{}); entry.target.classList.remove('is-paused'); }
                    if (!isShowingLiked) {
                        localStorage.setItem('lastWatched', index);
                        history.replaceState(null, null, `?v=${index}`);
}
                } else {
                    if (video) { video.pause(); video.currentTime = 0; entry.target.classList.add('is-paused'); }
                }
            });
        }, { threshold: 0.6 });

        function initFeed() {
            isShowingLiked = false;
            container.innerHTML = '';
            for (let i = 1; i <= TOTAL_VIDEOS; i++) {
                const w = document.createElement('div');
                w.className = 'video-player empty'; w.id = `wrapper-${i}`; w.dataset.index = i;
                container.appendChild(w); loadObserver.observe(w); playObserver.observe(w);
            }
            setTimeout(() => {
                const target = document.getElementById(`wrapper-${lastWatched}`);
                if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
            }, 50);
        }

        function renderVideoHTML(wrapper) {
            const index = parseInt(wrapper.dataset.index);
            const isLiked = likedVideos.includes(index) ? 'liked' : '';
            wrapper.classList.remove('empty');
            wrapper.innerHTML = `
                <div class="loader"></div>
                <i class="fas fa-play play-indicator"></i>
                <video id="vid-${index}" loop playsinline preload="metadata" onclick="handleTap(event, this, ${index})" src="video${index}.mp4"></video>
                <div class="side-bar">
                    <i class="fas fa-heart icon-btn like-btn-${index} ${isLiked}" onclick="toggleLike(${index})"></i>
                    <i class="fas fa-comment-dots icon-btn" onclick="openComments(${index})"></i>
                    <i class="fas fa-share icon-btn" onclick="shareVideo(${index})"></i>
                </div>
                <div class="ui-overlay">
                    <h4 style="margin:0 0 5px 0;">@Popek</h4>
                    <p style="margin:0; font-size: 14px;">PopekTok #${index}</p>
                </div>
            `;
            const vid = wrapper.querySelector('video');
            vid.onerror = function() {
                vid.outerHTML = `<img src="image2.png" class="fallback-img" onclick="handleTap(event, this, ${index})">`;
            };
        }

        // ==========================================
        // 4. UDOSTĘPNIANIE
        // ==========================================
        function shareVideo(index) {
            const shareUrl = `${window.location.origin}${window.location.pathname}?v=${index}`;
            if (navigator.share) {
                navigator.share({ title: 'PopekTok', text: `Zobacz PopekTok #${index}!`, url: shareUrl })
                .catch((e) => console.log('Błąd udostępniania', e));
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => alert("Skopiowano link do schowka!"));
            }
        }

        // ==========================================
        // 5. KOMENTARZE I PANEL ADMINA
        // ==========================================
        function openComments(index) {
            currentCommentVideoId = index;
            document.getElementById('comment-modal').classList.add('active');
            loadComments(index);
        }

        function loadComments(index) {
            const list = document.getElementById('comment-list');
            list.innerHTML = '<div class="loader" style="position:relative; margin: 20px auto;"></div>';

            db.collection("comments").where("videoId", "==", index).onSnapshot((snap) => {
                list.innerHTML = '';
                document.getElementById('comment-count').innerText = `(${snap.size})`;
                
                if (snap.empty) { list.innerHTML = '<p style="text-align:center; color:#888;">Brak komentarzy.</p>'; return; }

                let arr = [];
                snap.forEach((doc) => { let d = doc.data(); d.id = doc.id; arr.push(d); });
                arr.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));

                const currentUser = auth.currentUser;

                arr.forEach((data) => {
                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    
                    let dateStr = "";
                    if (data.timestamp) {
                        const d = data.timestamp.toDate();
                        dateStr = d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0');
                    }

                    let actionsHtml = '';
                    const isOwner = currentUser && currentUser.uid === data.authorUid;
                    const isAdmin = currentUser && currentUser.uid === ADMIN_UID;

                    if (isOwner || isAdmin) {
                        actionsHtml = `<div class="comment-actions">`;
                        if (isOwner) actionsHtml += `<span onclick="editComment('${data.id}')"><i class="fas fa-edit"></i> Edytuj</span>`;
                        actionsHtml += `<span class="delete-btn" onclick="deleteComment('${data.id}')"><i class="fas fa-trash"></i> Usuń ${isAdmin && !isOwner ? '(Admin)' : ''}</span></div>`;
                    }

                    div.innerHTML = `
                        <img src="${data.authorPhoto || 'image4.png'}" class="comment-avatar">
                        <div class="comment-content">
                            <strong>${data.authorName || 'Użytkownik'}</strong> <span class="date">${dateStr}</span>
                            <p id="comment-text-${data.id}">${data.text}</p>
                            ${actionsHtml}
                        </div>
                    `;
                    list.appendChild(div);
                });
                setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
            });
        }

        function addComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            const user = auth.currentUser;
            
            if (!user) return alert("Zaloguj się!");
            if (text === '' || currentCommentVideoId === null) return;
            
            input.value = ''; 
            
            db.collection("comments").add({
                videoId: currentCommentVideoId,
                text: text,
                authorName: user.displayName || "Użytkownik",
                authorPhoto: user.photoURL || "image4.png",
                authorUid: user.uid, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function deleteComment(docId) {
            if(confirm("Usunąć ten komentarz?")) {
                db.collection("comments").doc(docId).delete();
            }
        }

        function editComment(docId) {
            const currentText = document.getElementById('comment-text-' + docId).innerText;
            const newText = prompt("Edytuj komentarz:", currentText);
            if (newText && newText.trim() !== "") {
                db.collection("comments").doc(docId).update({ text: newText.trim() });
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') addComment(); }

        // ==========================================
        // 6. INTERAKCJE (LIKE, DOUBLE TAP)
        // ==========================================
        let clickTimer = null;
        function handleTap(e, el, index) {
            const w = el.closest('.video-player');
            if (clickTimer == null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (el.tagName === 'VIDEO') {
                        if (el.paused) { el.play(); w.classList.remove('is-paused'); } 
                        else { el.pause(); w.classList.add('is-paused'); }
                    }
                }, 250);
            } else {
                clearTimeout(clickTimer); clickTimer = null;
                if (el.tagName === 'VIDEO' && el.paused) { el.play(); w.classList.remove('is-paused'); }
                if (!likedVideos.includes(index)) toggleLike(index);
                
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart floating-heart';
                const rect = w.getBoundingClientRect();
                heart.style.left = `${e.clientX - rect.left}px`;
                heart.style.top = `${e.clientY - rect.top}px`;
                w.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        }

        function toggleLike(index) {
            const icons = document.querySelectorAll(`.like-btn-${index}`);
            if (likedVideos.includes(index)) {
                likedVideos = likedVideos.filter(id => id !== index);
                icons.forEach(i => i.classList.remove('liked'));
            } else {
                likedVideos.push(index);
                icons.forEach(i => i.classList.add('liked'));
            }
            localStorage.setItem('likedVideos', JSON.stringify(likedVideos));
        }

        function showLiked() {
            isShowingLiked = true; container.innerHTML = '';
            document.querySelectorAll('.nav-item')[1].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[0].classList.remove('active-tab');
            if (likedVideos.length === 0) return container.innerHTML = '<div class="video-player"><h2 style="color:white">Brak polubień</h2></div>';
            likedVideos.forEach(id => createEmptyWrapper(id));
        }

        function showFeed() {
            document.querySelectorAll('.nav-item')[0].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[1].classList.remove('active-tab');
            initFeed();
        }
        function createEmptyWrapper(index) {
            const w = document.createElement('div');
            w.className = 'video-player empty'; w.id = `wrapper-${index}`; w.dataset.index = index;
            container.appendChild(w); loadObserver.observe(w); playObserver.observe(w);
        }

        window.onload = initFeed;
    </script>
</body>
</html>
