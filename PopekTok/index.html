<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PopekTok Feed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #010101;
            --tiktok-red: #ff0050;
            --tiktok-cyan: #00f2ea;
            --text-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: 'ProximaNova', sans-serif;
            color: var(--text-white);
            display: flex;
            justify-content: center;
        }

        /* Główny kontener */
        #app-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100dvh;
            background-color: var(--bg-black);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Video Container */
        #video-container {
            width: 100%;
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: auto; 
            scrollbar-width: none; 
            overscroll-behavior-y: none; 
            -webkit-overflow-scrolling: touch; 
        }
        #video-container::-webkit-scrollbar { display: none; } 

        .video-player {
            width: 100%;
            height: 100%;
            scroll-snap-align: center; 
            scroll-snap-stop: always; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden; 
        }

        /* Wideo - ZMIANA NA CONTAIN ABY NIE UCINAŁO BOKÓW */
        video, .fallback-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Pokazuje cały kadr bez ucinania krawędzi */
            cursor: pointer;
            z-index: 2;
        }

        /* Animacja Ładowania (Spinner) */
        .loader {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--text-white);
            animation: spin 1s ease-in-out infinite;
            z-index: 1; 
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Play/Pause Indicator */
        .play-indicator {
            position: absolute;
            font-size: 80px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 5;
        }
        .is-paused .play-indicator { opacity: 1; }

        /* Floating Heart */
        .floating-heart {
            position: absolute;
            color: var(--tiktok-red);
            font-size: 80px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: popHeart 0.8s ease-out forwards;
            z-index: 15;
            text-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); }
            40% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); }
            100% { transform: translate(-50%, -150%) scale(1.5) rotate(0deg); opacity: 0; }
        }

        /* UI Overlays */
        .ui-overlay {
            position: absolute;
            bottom: 80px;
            left: 15px;
            z-index: 10;
            pointer-events: none; 
        }

        .side-bar {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            font-size: 32px;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .liked { color: var(--tiktok-red); }

        /* Navigation */
        .nav-tabs {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-weight: bold;
            z-index: 20;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        .nav-item { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        .active-tab { opacity: 1; border-bottom: 2px solid white; padding-bottom: 3px; }

        /* Bottom Menu */
        .bottom-menu {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div class="nav-tabs">
            <span class="nav-item active-tab" onclick="showFeed()">For You</span>
            <span class="nav-item" onclick="showLiked()">Liked</span>
        </div>

        <div id="video-container">
            </div>

        <div class="bottom-menu">
            <i class="fas fa-home icon-btn" onclick="showFeed()" style="font-size: 24px;"></i>
            <i class="fas fa-heart icon-btn" onclick="showLiked()" style="font-size: 24px;"></i>
        </div>
    </div>

    <script>
        const container = document.getElementById('video-container');
        const TOTAL_VIDEOS = 300;
        let likedVideos = JSON.parse(localStorage.getItem('likedVideos')) || [];
        let lastWatched = parseInt(localStorage.getItem('lastWatched')) || 1;
        let highestLoadedIndex = 0;
        let isShowingLiked = false;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const wrapper = entry.target;
                const video = wrapper.querySelector('video');
                const index = parseInt(wrapper.dataset.index);

                if (entry.isIntersecting) {
                    if (video) {
                        video.play().catch(e => console.log("Czekam na załadowanie...", e));
                        wrapper.classList.remove('is-paused');
                    }
                    
                    if (!isShowingLiked) {
                        localStorage.setItem('lastWatched', index);
                    }

                    if (!isShowingLiked && index >= highestLoadedIndex - 1) {
                        loadMoreVideos(1); 
                    }
                } else {
                    if (video) {
                        video.pause();
                        video.currentTime = 0; 
                        wrapper.classList.add('is-paused');
                    }
                }
            });
        }, { threshold: 0.6 });

        function initFeed() {
            isShowingLiked = false;
            container.innerHTML = '';
            highestLoadedIndex = lastWatched - 1; 
            
            loadMoreVideos(2);
        }

        function loadMoreVideos(count) {
            for (let i = 0; i < count; i++) {
                highestLoadedIndex++;
                if (highestLoadedIndex > TOTAL_VIDEOS) break;
                addVideoToDOM(highestLoadedIndex);
            }
        }

        function addVideoToDOM(index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-player';
            wrapper.dataset.index = index;

            const isLiked = likedVideos.includes(index) ? 'liked' : '';

            wrapper.innerHTML = `
                <div class="loader"></div>
                <i class="fas fa-play play-indicator"></i>
                <video id="vid-${index}" loop playsinline preload="none" onclick="handleTap(event, this, ${index})" style="background: transparent;">
                    <source src="video${index}.mp4" type="video/mp4">
                </video>
                <div class="side-bar">
                    <i class="fas fa-heart icon-btn like-btn-${index} ${isLiked}" onclick="toggleLike(${index})"></i>
                    <i class="fas fa-comment-dots icon-btn"></i>
                    <i class="fas fa-share icon-btn"></i>
                </div>
                <div class="ui-overlay">
                    <h4 style="margin:0 0 5px 0;">@Popek</h4>
                    <p style="margin:0; font-size: 14px;">PopekTok #${index}</p>
                </div>
            `;

            const videoElement = wrapper.querySelector('video');

            videoElement.onerror = function() {
                this.parentElement.innerHTML = `
                    <img src="image2.png" class="fallback-img" onclick="handleTap(event, this, ${index})">
                    <div class="side-bar">
                        <i class="fas fa-heart icon-btn like-btn-${index} ${isLiked}" onclick="toggleLike(${index})"></i>
                    </div>
                    <div class="ui-overlay">
                        <h4 style="margin:0 0 5px 0;">@Popek</h4>
                        <p style="margin:0;">PopekTok #${index} (Niedostępne)</p>
                    </div>
                `;
            };

            container.appendChild(wrapper);
            observer.observe(wrapper); 
        }

        let clickTimer = null;

        function handleTap(e, element, index) {
            const wrapper = element.closest('.video-player');
            
            if (clickTimer == null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (element.tagName === 'VIDEO') {
                        if (element.paused) {
                            element.play();
                            wrapper.classList.remove('is-paused');
                        } else {
                            element.pause();
                            wrapper.classList.add('is-paused');
                        }
                    }
                }, 250); 
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                
                if (element.tagName === 'VIDEO' && element.paused) {
                    element.play();
                    wrapper.classList.remove('is-paused');
                }

                if (!likedVideos.includes(index)) {
                    toggleLike(index);
                }

                spawnHeart(e, wrapper);
            }
        }

        function spawnHeart(e, wrapper) {
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart floating-heart';
            
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            
            wrapper.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 800);
        }

        function toggleLike(index) {
            const heartIcons = document.querySelectorAll(`.like-btn-${index}`);
            
            if (likedVideos.includes(index)) {
                likedVideos = likedVideos.filter(id => id !== index);
                heartIcons.forEach(icon => icon.classList.remove('liked'));
            } else {
                likedVideos.push(index);
                heartIcons.forEach(icon => icon.classList.add('liked'));
            }
            localStorage.setItem('likedVideos', JSON.stringify(likedVideos));
        }

        function showLiked() {
            isShowingLiked = true;
            container.innerHTML = '';
            if (likedVideos.length === 0) {
                container.innerHTML = '<div class="video-player"><h2>Brak polubionych filmów</h2></div>';
                document.querySelectorAll('.nav-item')[1].classList.add('active-tab');
                document.querySelectorAll('.nav-item')[0].classList.remove('active-tab');
                return;
            }
            
            likedVideos.forEach(id => addVideoToDOM(id));
            
            document.querySelectorAll('.nav-item')[1].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[0].classList.remove('active-tab');
        }

        function showFeed() {
            document.querySelectorAll('.nav-item')[0].classList.add('active-tab');
            document.querySelectorAll('.nav-item')[1].classList.remove('active-tab');
            initFeed();
        }

        window.onload = initFeed;
    </script>
</body>
</html>
