<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopekChess</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="auth-screen" class="screen" style="display: flex;">
        <h1 style="font-size: 2.8rem; margin: 0 0 10px 0; background: linear-gradient(45deg, #81b64c, #a3d16c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: 1px; text-align: center;">PopekChess</h1>
        <div class="auth-form" id="login-form">
            <button onclick="loginWithGoogle()" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px; background: white; border-radius: 50%; padding: 2px;">
                Zaloguj przez Google
            </button>
            <div class="separator">LUB E-MAIL</div>
            <input type="email" id="auth-email" placeholder="E-mail">
            <input type="password" id="auth-pass" placeholder="Hasło">
            <input type="text" id="auth-nick" placeholder="Twój Unikalny Nick" style="display:none;">
            <button onclick="login()">Zaloguj się</button>
            <button onclick="toggleRegister()" class="btn-secondary" id="btn-toggle-reg">Chcę założyć konto</button>
        </div>
        <div class="separator">LUB ZAGRAJ JAKO GOŚĆ</div>
        <div class="auth-form">
            <input type="text" id="guest-nick" placeholder="Nick Gościa">
            <button onclick="playAsGuest()" class="btn-secondary">Graj jako Gość</button>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <h1 style="font-size: 2.5rem; margin: 5px 0 15px 0; background: linear-gradient(45deg, #81b64c, #a3d16c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: 1px;">PopekChess</h1>
        
        <div class="profile-badge">
            <div class="profile-avatar-container" onclick="triggerAvatarUpload()">
                <img id="menu-user-avatar" class="profile-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23555'><circle cx='12' cy='8' r='4'/><path d='M12 14c-6.1 0-8 4-8 4h16s-1.9-4-8-4z'/></svg>">
                <div class="avatar-hint">Zmień</div>
            </div>
            <input type="file" id="avatar-input" class="hidden-file" accept="image/*" onchange="uploadAvatar(event)">
            <div>
                <div id="menu-player-name" style="font-size: 1.2rem; font-weight: bold;">Gracz</div>
                <div id="menu-player-elo" style="color: #aaa;">ELO: ---</div>
            </div>
        </div>

        <div style="background: #1a1917; padding: 12px; border-radius: 8px; border: 1px solid #333; text-align: left;">
            <div class="panel-title" style="margin-bottom: 2px;">Znajomi Online</div>
            <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                <input type="text" id="friend-nick-input" placeholder="Wpisz dokładnie nick znajomego" style="padding: 6px; font-size: 0.85rem; text-align: left;">
                <button onclick="addFriendByNick()" style="width: auto; padding: 6px 12px; font-size: 0.85rem;">Dodaj</button>
            </div>
            <div class="friends-list" id="friends-box"></div>
        </div>

        <div style="background: #1a1917; padding: 15px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px;">
            <h3 style="margin:0; font-size: 1rem; text-align: center;">Graj Online (Ranked)</h3>
            <select id="time-control">
                <option value="30">30 Sekund</option>
                <option value="60">1 Minuta</option>
                <option value="300" selected>5 Minut</option>
                <option value="600">10 Minut</option>
                <option value="1800">30 Minut</option>
            </select>
            <button id="btn-matchmaking" onclick="startMatchmaking()">Szukaj przeciwnika</button>
            <div id="matchmaking-status" style="color:#aaa; font-size:0.8rem; margin-top:5px; text-align: center;"></div>
        </div>

        <div class="separator">PRYWATNE LOBBY</div>
        <button onclick="createPrivateGame()" class="btn-secondary">Załóż pokój prywatny</button>
        <input type="text" id="join-code-input" placeholder="Wpisz kod pokoju">
        <button onclick="joinPrivateGame()" class="btn-secondary">Dołącz do pokoju</button>
        
        <button onclick="logout()" style="background: #c0392b; margin-top: 10px;">Wyloguj</button>
    </div>

    <div id="challenge-modal">
        <div id="challenge-content">
            <h3 style="margin:0; color: var(--accent);" id="challenge-text">Wyzwanie!</h3>
            <div style="display:flex; gap: 10px;">
                <button onclick="respondChallenge(true)">Graj</button>
                <button onclick="respondChallenge(false)" class="btn-secondary">Odrzuć</button>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <div id="status-panel">Trwa łączenie...</div>
        <div id="game-container">
            <div id="board-container">
                <div class="player-header" id="header-opponent">
                    <div class="header-user-info">
                        <img id="opp-avatar-img" class="game-avatar" src="">
                        <span id="opp-name">Przeciwnik</span>
                    </div>
                    <span class="timer" id="opp-timer">00:00</span>
                </div>
                <div id="board"></div>
                <div class="player-header" id="header-me">
                    <div class="header-user-info">
                        <img id="my-avatar-img" class="game-avatar" src="">
                        <span id="my-name">Ja</span>
                    </div>
                    <span class="timer" id="my-timer">00:00</span>
                </div>

                <div id="game-over-screen">
                    <div id="game-over-text">Koniec Gry!</div>
                    <div class="elo-change" id="elo-change-text"></div>
                    <button onclick="backToMenu();">Powrót do menu</button>
                </div>
                <div id="draw-modal">
                    <div id="draw-content">
                        <h3 style="margin:0; color: var(--accent);">Przeciwnik oferuje remis</h3>
                        <button onclick="respondDraw(true)">Akceptuj remis</button>
                        <button onclick="respondDraw(false)" class="btn-secondary">Odrzuć</button>
                    </div>
                </div>
                <div id="promotion-modal">
                    <div id="promotion-content">
                        <h3 style="margin-top:0;">Awans pionka:</h3>
                        <div id="promotion-choices-container"></div>
                    </div>
                </div>
            </div>

            <div id="side-panel">
                <div class="panel-section"><div class="panel-title" id="room-display-code">KOD: ------</div></div>
                
                <div class="panel-section">
                    <div class="panel-title">Wygląd figur</div>
                    <select id="theme-select" onchange="changeChessTheme()">
                        <option value="classic">Zestaw 1 (photo1-6)</option>
                        <option value="alternative">Zestaw 2 (photo9-14)</option>
                    </select>
                </div>

                <div class="panel-section"><div class="panel-title">Historia</div><div id="move-history"></div></div>
                <div class="panel-section">
                    <div class="panel-title">Czat meczowy</div>
                    <div id="chat-box"></div>
                    <input type="text" id="chat-input" placeholder="Napisz wiadomość..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                </div>
                <button id="btn-draw" onclick="proposeDraw()" class="btn-secondary" style="margin-bottom: 2px; display: none; padding:8px;">Zaproponuj remis</button>
                <button id="btn-action" onclick="handleActionButton()" style="background: #d35400; padding:8px;">Anuluj szukanie</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
