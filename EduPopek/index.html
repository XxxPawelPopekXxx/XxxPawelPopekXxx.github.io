<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPopek</title>
  <link rel="icon" href="image1.png" />
  <style>
    :root {
      --bg: #0b0f1a;
      --bg2: #111827;
      --card: #151c2c;
      --card-hover: #1a2336;
      --border: #1f2a3f;
      --text: #e8eef9;
      --muted: #8b9bb8;
      --primary: #7c6cff;
      --primary2: #a78bfa;
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,108,255,0.25), transparent), var(--bg);
    }
    .login-card {
      width: 100%; max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
      text-align: center;
    }
    .login-card img {
      width: 88px; height: 88px; object-fit: contain;
      border-radius: 20px; margin-bottom: 14px;
      background: var(--bg2); padding: 8px;
    }
    .login-card h1 {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #7c6cff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .login-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%; padding: 13px 14px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 15px;
    }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary {
      width: 100%; padding: 14px; margin-top: 8px;
      background: linear-gradient(135deg, #7c6cff, #9f7aea); color: white;
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 8px 14px; font-size: 13px;
    }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary2); }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 14px; display: none; }

    #app { display: none; min-height: 100vh; }
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; }
    .brand span {
      font-weight: 800; font-size: 18px;
      background: linear-gradient(135deg, #a78bfa, #7c6cff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .user-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .lucky {
      background: linear-gradient(135deg, #f59e0b22, #fbbf2422);
      border: 1px solid #fbbf2433; color: var(--warn);
      padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px;
    }
    .icon-btn {
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg2); color: var(--text);
      text-decoration: none; font-size: 16px;
      transition: all 0.15s;
    }
    .icon-btn:hover { border-color: var(--primary); background: var(--card); transform: translateY(-1px); }
    .icon-btn img { width: 18px; height: 18px; object-fit: contain; border-radius: 4px; }

    nav {
      display: flex; gap: 2px; padding: 0 10px;
      background: var(--bg2); border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      padding: 13px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--primary2); border-bottom-color: var(--primary); }
    main { max-width: 920px; margin: 0 auto; padding: 20px 14px 50px; }
    .section { display: none; }
    .section.active { display: block; animation: up 0.22s ease; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-head h2 { font-size: 20px; font-weight: 700; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card:hover { background: var(--card-hover); }
    .card-title {
      font-size: 14px; font-weight: 700; color: #c4b5fd;
      margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .avg {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--bg2); padding: 3px 8px; border-radius: 8px;
    }
    .grades-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .grade-pill {
      min-width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; font-weight: 800; font-size: 16px;
      background: #2e1065; color: #ddd6fe; cursor: default; position: relative;
    }
    .grade-pill[title]:hover::after {
      content: attr(title); position: absolute; bottom: calc(100% + 6px);
      left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      font-size: 11px; font-weight: 500; padding: 6px 10px; border-radius: 8px;
      white-space: pre-wrap; max-width: 220px; z-index: 10; pointer-events: none;
    }
    .sem-label {
      font-size: 11px; color: var(--muted); margin: 10px 0 6px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .lesson {
      display: grid; grid-template-columns: 72px 1fr auto;
      gap: 10px; align-items: center; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .lesson:last-child { border-bottom: none; }
    .lesson-time { font-size: 12px; color: var(--muted); font-weight: 600; }
    .lesson-sub { font-weight: 600; font-size: 14px; }
    .lesson-meta { font-size: 12px; color: var(--muted); }
    .lesson-room { font-size: 12px; color: var(--muted); }
    .cancelled { opacity: 0.45; text-decoration: line-through; }
    .flag {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
      background: #7c2d12; color: #fdba74; margin-left: 6px; vertical-align: middle;
    }
    .day-label {
      font-size: 12px; font-weight: 700; color: #a5b4fc;
      text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 8px;
    }
    .day-label:first-child { margin-top: 0; }
    .row-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .row-item:last-child { border-bottom: none; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 9px;
      border-radius: 999px; white-space: nowrap;
    }
    .b-ok { background: #064e3b; color: #6ee7b7; }
    .b-warn { background: #78350f; color: #fcd34d; }
    .b-bad { background: #7f1d1d; color: #fca5a5; }
    .b-info { background: #1e3a5f; color: #93c5fd; }
    .loading, .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg-item, .ann-item {
      padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .msg-item:last-child, .ann-item:last-child { border-bottom: none; }
    .msg-item:hover, .ann-item:hover { opacity: 0.9; }
    .msg-title, .ann-title { font-weight: 600; font-size: 14px; }
    .msg-meta, .ann-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .msg-body, .ann-body {
      margin-top: 10px; padding: 12px;
      background: var(--bg2); border-radius: 10px;
      font-size: 13px; white-space: pre-wrap; line-height: 1.55;
      display: none;
    }
    .msg-body.open, .ann-body.open { display: block; }
    .back-btn {
      background: none; border: none; color: var(--primary2);
      font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 12px;
    }
    footer { text-align: center; padding: 16px; font-size: 11px; color: var(--muted); }
    @media (max-width: 560px) {
      .user-bar .name { display: none; }
      .lesson { grid-template-columns: 60px 1fr; }
      .lesson-room { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <img src="image1.png" alt="logo" onerror="this.style.display='none'" />
      <h1>EduPopek</h1>
      <p class="sub">Twój profesjonalny EduPopek</p>
      <div class="form-group">
        <label>Login</label>
        <input type="text" id="login" value="" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Hasło</label>
        <input type="password" id="password" value="" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">Zaloguj się</button>
      <p class="error-msg" id="login-error"></p>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="brand">
        <img src="image1.png" alt="" onerror="this.style.display='none'" />
        <span>EduPopek</span>
      </div>
      <div class="user-bar">
        <span class="lucky" id="lucky-box" style="display:none"></span>
        <a class="icon-btn" href="https://chess.com" target="_blank" rel="noopener" title="Chess.com">♟️</a>
        <a class="icon-btn" href="https://pawelpopek.baby" target="_blank" rel="noopener" title="pawelpopek.baby">
          <img src="image1.png" alt="portal" onerror="this.parentElement.textContent='🌐'" />
        </a>
        <span class="name" id="user-name">—</span>
        <button class="btn btn-ghost" onclick="doLogout()">Wyloguj</button>
      </div>
    </header>
    <nav>
      <button class="nav-btn active" data-s="oceny" onclick="go('oceny')">Oceny</button>
      <button class="nav-btn" data-s="plan" onclick="go('plan')">Plan</button>
      <button class="nav-btn" data-s="obecnosci" onclick="go('obecnosci')">Obecności</button>
      <button class="nav-btn" data-s="terminarz" onclick="go('terminarz')">Terminarz</button>
      <button class="nav-btn" data-s="ogloszenia" onclick="go('ogloszenia')">Ogłoszenia</button>
      <button class="nav-btn" data-s="wiadomosci" onclick="go('wiadomosci')">Wiadomości</button>
    </nav>
    <main>
      <section id="s-oceny" class="section active">
        <div class="section-head"><h2>Oceny</h2></div>
        <div id="c-oceny"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
      <section id="s-plan" class="section">
        <div class="section-head"><h2>Plan lekcji</h2></div>
        <div id="c-plan"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
      <section id="s-obecnosci" class="section">
        <div class="section-head"><h2>Obecności</h2></div>
        <div id="c-obecnosci"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
      <section id="s-terminarz" class="section">
        <div class="section-head"><h2>Terminarz</h2></div>
        <div id="c-terminarz"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
      <section id="s-ogloszenia" class="section">
        <div class="section-head"><h2>Ogłoszenia</h2></div>
        <div id="c-ogloszenia"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
      <section id="s-wiadomosci" class="section">
        <div class="section-head"><h2>Wiadomości</h2></div>
        <div id="c-wiadomosci"><div class="loading"><div class="spinner"></div>Ładowanie…</div></div>
      </section>
    </main>
    <footer>EduPopek · nieoficjalny klient Librusa</footer>
  </div>

<script>
(function () {
  const API = 'https://implementation-addressed-adventures-clan.trycloudflare.com';
  let token = localStorage.getItem('ep_token') || null;
  const loaded = {};
  const $ = id => document.getElementById(id);

  async function api(path, opts) {
    opts = opts || {};
    const url = API.replace(/\/$/, '') + path;
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(url, Object.assign({}, opts, { headers: headers }));
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const err = new Error((data && (data.error || data.message)) || ('Błąd ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function showErr(msg) {
    const el = $('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  window.doLogin = async function () {
    $('login-error').style.display = 'none';
    const login = $('login').value.trim();
    const password = $('password').value;
    if (!login || !password) return showErr('Podaj login i hasło');
    const btn = $('btn-login');
    btn.disabled = true;
    btn.textContent = 'Logowanie…';
    try {
      const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ login: login, password: password }) });
      token = data.token;
      localStorage.setItem('ep_token', token);
      $('user-name').textContent = data.name || login;
      $('login-screen').style.display = 'none';
      $('app').style.display = 'block';
      loadLucky();
      go('oceny');
    } catch (e) {
      showErr(e.message || 'Błąd logowania');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Zaloguj się';
    }
  };

  window.doLogout = async function () {
    try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
    token = null;
    localStorage.removeItem('ep_token');
    Object.keys(loaded).forEach(function (k) { delete loaded[k]; });
    $('app').style.display = 'none';
    $('login-screen').style.display = 'flex';
  };

  async function loadLucky() {
    try {
      const n = await api('/api/lucky');
      if (n != null && n !== '') {
        const box = $('lucky-box');
        box.style.display = 'inline';
        box.textContent = 'Szczęśliwy: ' + n;
      }
    } catch (e) {}
  }

  (async function () {
    if (!token) return;
    try {
      const me = await api('/api/me');
      $('user-name').textContent = me.name || 'Zalogowany';
      $('login-screen').style.display = 'none';
      $('app').style.display = 'block';
      loadLucky();
      go('oceny');
    } catch (e) {
      token = null;
      localStorage.removeItem('ep_token');
    }
  })();

  window.go = function (name) {
    document.querySelectorAll('.nav-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.s === name);
    });
    document.querySelectorAll('.section').forEach(function (s) {
      s.classList.toggle('active', s.id === 's-' + name);
    });
    load(name);
  };

  async function load(name) {
    if (loaded[name]) return;
    const el = $('c-' + name);
    el.innerHTML = '<div class="loading"><div class="spinner"></div>Ładowanie…</div>';
    try {
      if (name === 'oceny') await renderGrades(el);
      else if (name === 'plan') await renderPlan(el);
      else if (name === 'obecnosci') await renderAbsences(el);
      else if (name === 'terminarz') await renderCalendar(el);
      else if (name === 'ogloszenia') await renderAnnouncements(el);
      else if (name === 'wiadomosci') await renderMessages(el);
      loaded[name] = true;
    } catch (e) {
      if (e.status === 401) return doLogout();
      el.innerHTML = '<div class="empty">Nie udało się pobrać danych<br><span style="font-size:12px">' + esc(e.message) + '</span></div>';
    }
  }

  async function renderGrades(el) {
    const data = await api('/api/grades');
    const list = Array.isArray(data) ? data : [];
    if (!list.length) {
      el.innerHTML = '<div class="empty">Brak ocen<br><span style="font-size:12px">Albo Librus zmienił strukturę / konto nie ma ocen</span></div>';
      return;
    }
    let html = '';
    list.forEach(function (sub) {
      const name = sub.name || sub.Name || '?';
      const avg = sub.average || sub.tempAverage;
      html += '<div class="card"><div class="card-title">' + esc(name);
      if (avg != null && !isNaN(avg)) html += '<span class="avg">śr. ' + Number(avg).toFixed(2) + '</span>';
      html += '</div>';
      const semesters = sub.semester || [];
      let hasAny = false;
      semesters.forEach(function (sem, i) {
        const grades = (sem && sem.grades) || [];
        if (!grades.length) return;
        hasAny = true;
        html += '<div class="sem-label">Semestr ' + (i + 1);
        if (sem.average != null && !isNaN(sem.average)) html += ' · śr. ' + Number(sem.average).toFixed(2);
        html += '</div><div class="grades-row">';
        grades.forEach(function (g) {
          const val = g.value || g.grade || '?';
          const tip = (g.info || '').replace(/"/g, '&quot;');
          html += '<div class="grade-pill" title="' + tip + '">' + esc(val) + '</div>';
        });
        html += '</div>';
      });
      if (!hasAny) html += '<p style="color:var(--muted);font-size:13px">Brak ocen</p>';
      html += '</div>';
    });
    el.innerHTML = html;
  }

  async function renderPlan(el) {
    const data = await api('/api/timetable');
    const table = (data && data.table) || data || {};
    const dayNames = {
      Monday: 'Poniedziałek', Tuesday: 'Wtorek', Wednesday: 'Środa',
      Thursday: 'Czwartek', Friday: 'Piątek', Saturday: 'Sobota', Sunday: 'Niedziela'
    };
    const order = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    let html = '';
    let any = false;
    order.forEach(function (day) {
      const lessons = table[day];
      if (!lessons || !lessons.length) return;
      const filled = lessons.filter(function (l) { return l && l.subject; });
      if (!filled.length) return;
      any = true;
      html += '<div class="day-label">' + (dayNames[day] || day) + '</div><div class="card">';
      lessons.forEach(function (l) {
        if (!l || !l.subject) return;
        const cancelled = l.cancelled;
        const flag = l.flag && l.flag !== 'odwołane' ? '<span class="flag">' + esc(l.flag) + '</span>' : '';
        html += '<div class="lesson ' + (cancelled ? 'cancelled' : '') + '">';
        html += '<div class="lesson-time">' + esc(l.time || '') + '</div>';
        html += '<div><div class="lesson-sub">' + esc(l.subject) + flag + '</div>';
        html += '<div class="lesson-meta">' + esc(l.teacher || '') + '</div></div>';
        html += '<div class="lesson-room">' + esc(l.room || '') + '</div></div>';
      });
      html += '</div>';
    });
    el.innerHTML = any ? html : '<div class="empty">Brak planu lekcji na ten tydzień</div>';
  }

  async function renderAbsences(el) {
    const data = await api('/api/absences');
    let items = [];
    if (Array.isArray(data)) {
      items = data;
    } else if (data && typeof data === 'object') {
      Object.keys(data).forEach(function (k) {
        const arr = data[k];
        if (Array.isArray(arr)) items = items.concat(arr);
      });
    }
    if (!items.length) {
      el.innerHTML = '<div class="empty">Brak nieobecności 🎉</div>';
      return;
    }
    let html = '<div class="card">';
    items.slice(0, 100).forEach(function (a) {
      const date = a.date || '—';
      const types = (a.table || []).filter(Boolean).map(function (t) { return t.type || t; }).join(', ') || '—';
      const low = types.toLowerCase();
      let cls = 'b-bad';
      if (/obecn|ob\\b/.test(low)) cls = 'b-ok';
      else if (/spóźn|sp\\b/.test(low)) cls = 'b-warn';
      else if (/uspr|uspraw/.test(low)) cls = 'b-info';
      html += '<div class="row-item"><div><div style="font-weight:600">' + esc(date) + '</div>';
      if (a.info && a.info.length) html += '<div style="font-size:12px;color:var(--muted)">' + esc(a.info.filter(Boolean).join(' · ')) + '</div>';
      html += '</div><span class="badge ' + cls + '">' + esc(types) + '</span></div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  async function renderCalendar(el) {
    const data = await api('/api/calendar');
    let list = [];
    if (Array.isArray(data)) list = data;
    else if (data && typeof data === 'object') {
      // czasem obiekt z dniami
      Object.keys(data).forEach(function (k) {
        const v = data[k];
        if (Array.isArray(v)) list = list.concat(v);
        else if (v && typeof v === 'object') list.push(Object.assign({ day: k }, v));
      });
    }
    list = list.filter(Boolean);
    if (!list.length) {
      el.innerHTML = '<div class="empty">Pusty terminarz<br><span style="font-size:12px">Brak wydarzeń w kalendarzu Librusa (albo biblioteka nie sparsowała HTML)</span></div>';
      return;
    }
    const byDay = {};
    list.forEach(function (ev) {
      const d = ev.day || ev.date || 'Inne';
      if (!byDay[d]) byDay[d] = [];
      byDay[d].push(ev);
    });
    const days = Object.keys(byDay).sort();
    let html = '';
    days.forEach(function (day) {
      html += '<div class="day-label">' + esc(day) + '</div><div class="card">';
      byDay[day].forEach(function (ev) {
        const title = ev.title || ev.name || ev.category || 'Wydarzenie';
        const info = ev.info || ev.description || ev.desc || '';
        html += '<div class="row-item"><div>';
        html += '<div style="font-weight:600">' + esc(title) + '</div>';
        if (info && info !== title) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(info) + '</div>';
        html += '</div></div>';
      });
      html += '</div>';
    });
    el.innerHTML = html;
  }

  async function renderAnnouncements(el) {
    const data = await api('/api/announcements');
    const list = Array.isArray(data) ? data : [];
    if (!list.length) {
      el.innerHTML = '<div class="empty">Brak ogłoszeń</div>';
      return;
    }
    let html = '<div class="card">';
    list.forEach(function (a, i) {
      const title = a.title || a.subject || a.Topic || 'Ogłoszenie';
      const author = a.user || a.author || a.teacher || a.from || '';
      const date = a.date || a.startDate || '';
      const body = a.content || a.body || a.description || a.text || a.message || '';
      html += '<div class="ann-item" onclick="toggleAnn(' + i + ')">';
      html += '<div class="ann-title">' + esc(title) + '</div>';
      html += '<div class="ann-meta">' + esc(author) + (date ? ' · ' + esc(date) : '') + '</div>';
      if (body) html += '<div class="ann-body" id="ann-body-' + i + '">' + esc(body) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  window.toggleAnn = function (i) {
    const el = document.getElementById('ann-body-' + i);
    if (el) el.classList.toggle('open');
  };

  async function renderMessages(el) {
    const data = await api('/api/messages');
    const list = Array.isArray(data) ? data : (data.messages || data.items || []);
    if (!list.length) {
      el.innerHTML = '<div class="empty">Brak wiadomości</div>';
      return;
    }
    let html = '<div class="card" id="msg-list">';
    list.slice(0, 50).forEach(function (m, i) {
      const title = m.title || m.subject || m.Topic || 'Wiadomość';
      const from = m.user || m.sender || m.from || m.userName || m.author || '';
      const date = m.date || m.sendDate || '';
      const id = m.id || m.messageId || m.Id || null;
      const folder = m.folder || 5;
      html += '<div class="msg-item" data-id="' + esc(String(id || '')) + '" data-folder="' + esc(String(folder)) + '" onclick="openMessage(this)">';
      html += '<div class="msg-title">' + esc(title) + '</div>';
      html += '<div class="msg-meta">' + esc(from) + (date ? ' · ' + esc(date) : '') + '</div>';
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  }

  window.openMessage = async function (node) {
    const id = node.getAttribute('data-id');
    const folder = node.getAttribute('data-folder') || '5';
    const el = $('c-wiadomosci');
    if (!id || id === 'null' || id === 'undefined') {
      el.innerHTML = '<button class="back-btn" onclick="reloadMessages()">← Wróć</button><div class="card"><p style="color:var(--muted)">Brak ID wiadomości – nie da się otworzyć treści.</p></div>';
      return;
    }
    el.innerHTML = '<div class="loading"><div class="spinner"></div>Wczytywanie wiadomości…</div>';
    try {
      const msg = await api('/api/message/' + folder + '/' + id);
      const title = msg.title || msg.subject || 'Wiadomość';
      const from = msg.user || msg.sender || msg.from || msg.userName || '';
      const date = msg.date || msg.sendDate || '';
      const body = msg.content || msg.body || msg.html || msg.text || msg.message || JSON.stringify(msg, null, 2);
      let html = '<button class="back-btn" onclick="reloadMessages()">← Wróć do listy</button>';
      html += '<div class="card">';
      html += '<div style="font-weight:700;font-size:16px;margin-bottom:6px">' + esc(title) + '</div>';
      html += '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">' + esc(from) + (date ? ' · ' + esc(date) : '') + '</div>';
      html += '<div style="font-size:14px;white-space:pre-wrap;line-height:1.6">' + (typeof body === 'string' ? body : esc(String(body))) + '</div>';
      html += '</div>';
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<button class="back-btn" onclick="reloadMessages()">← Wróć</button><div class="empty">' + esc(e.message) + '</div>';
    }
  };

  window.reloadMessages = function () {
    delete loaded['wiadomosci'];
    load('wiadomosci');
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  $('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
})();
</script>
</body>
</html>
