<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D City Drive - kolizje, wysokie budynki, AI losowe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }
        
        .car-selector-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 200, 100, 0.5);
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        
        .car-btn {
            background: #1a2a28;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .car-btn img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            pointer-events: none;
            background: linear-gradient(135deg, #2a3a38, #1a2a28);
            border-radius: 12px;
            padding: 5px;
        }
        
        .car-btn span {
            font-size: 11px;
            font-weight: bold;
            color: #ffecb3;
            background: #00000088;
            padding: 2px 10px;
            border-radius: 20px;
        }
        
        .car-btn.active {
            background: #f5a623;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px #ffdd99, 0 0 0 4px #2c4a44;
        }
        
        .car-btn.active span {
            color: #2c1e0a;
            background: #ffefc0;
        }
        
        .controls-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border-left: 3px solid #f5a623;
        }
        
        .controls-info kbd {
            background: #2a3a38;
            padding: 2px 8px;
            border-radius: 20px;
            margin: 0 2px;
            font-weight: bold;
        }
        
        .title {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 30px;
            color: #ffdd99;
            font-weight: bold;
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        
        @media (max-width: 800px) {
            .car-btn img { width: 40px; height: 40px; }
            .car-btn span { font-size: 9px; }
            .car-selector-panel { padding: 8px 12px; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="title">🚗 CITY DRIVE 3D | WYSOKIE BUDYNKI | AI LOSOWE</div>
    <div class="controls-info">
        🖱️ <kbd>MYSZKA</kbd> obrót kamery &nbsp;&nbsp;|&nbsp;&nbsp;
        <kbd>W A S D</kbd> jazda &nbsp;&nbsp;|&nbsp;&nbsp;
        <kbd>ESC</kbd> odblokuj kursor
    </div>
    <div class="car-selector-panel" id="carSelector"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- KONFIGURACJA SCENY ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a2f2a);
        scene.fog = new THREE.FogExp2(0x0a2f2a, 0.0006);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 14);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // ---------- KONTROLKI ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.3;
        controls.minDistance = 5;
        controls.maxDistance = 24;
        controls.target.set(0, 0, 0);
        
        // ---------- OŚWIETLENIE ----------
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.3);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -15;
        sunLight.shadow.camera.right = 15;
        sunLight.shadow.camera.top = 15;
        sunLight.shadow.camera.bottom = -15;
        scene.add(sunLight);
        
        const fillLight = new THREE.PointLight(0x88aadd, 0.5);
        fillLight.position.set(5, 10, 7);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(-3, 5, -6);
        scene.add(backLight);
        
        // ---------- GENEROWANIE MIASTA Z WYSOKIMI BUDYNKAMI ----------
        // Podłoże asfaltowe
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(220, 220),
            new THREE.MeshStandardMaterial({ color: 0x2a3a35, roughness: 0.7, metalness: 0.1 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.2;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        // Siatka dróg
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2e2c, roughness: 0.4 });
        const roadWidth = 2.2;
        const roads = [
            { x: 0, z: -28, w: 220, h: roadWidth },
            { x: 0, z: -14, w: 220, h: roadWidth },
            { x: 0, z: 0, w: 220, h: roadWidth },
            { x: 0, z: 14, w: 220, h: roadWidth },
            { x: 0, z: 28, w: 220, h: roadWidth },
            { x: -28, z: 0, w: roadWidth, h: 220 },
            { x: -14, z: 0, w: roadWidth, h: 220 },
            { x: 0, z: 0, w: roadWidth, h: 220 },
            { x: 14, z: 0, w: roadWidth, h: 220 },
            { x: 28, z: 0, w: roadWidth, h: 220 }
        ];
        roads.forEach(road => {
            const block = new THREE.Mesh(new THREE.BoxGeometry(road.w, 0.1, road.h), roadMaterial);
            block.position.set(road.x, -0.1, road.z);
            block.receiveShadow = true;
            scene.add(block);
        });
        
        // Linie na drogach
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffdd99 });
        for (let z = -55; z <= 55; z += 4) {
            if (Math.abs(z) < 3) continue;
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 3.5), lineMat);
            line.position.set(0, 0.05, z);
            scene.add(line);
        }
        for (let x = -55; x <= 55; x += 4) {
            if (Math.abs(x) < 3) continue;
            const lineV = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.08, 0.25), lineMat);
            lineV.position.set(x, 0.05, 0);
            scene.add(lineV);
        }
        
        // WYSOKIE BUDYNKI (2-4 piętra)
        const buildingColors = [0x8b5a2b, 0xa0663a, 0x7a4c2a, 0x6d8f7a, 0x5e7c6e, 0xbd8a5a, 0x4a6b62, 0x957b4e, 0x6a4c3c, 0x587b6e];
        const buildings = []; // przechowujemy budynki do kolizji
        
        for (let i = -12; i <= 12; i++) {
            for (let j = -12; j <= 12; j++) {
                // Pomijamy centrum i drogi
                const distToCenter = Math.hypot(i * 2.5, j * 2.5);
                if (distToCenter < 8) continue;
                if (Math.random() > 0.65) continue;
                
                const width = 1.4 + Math.random() * 1.0;
                const depth = 1.4 + Math.random() * 1.0;
                const height = 1.5 + Math.random() * 2.5; // WYSOKIE: od 1.5 do 4
                const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, depth),
                    new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 })
                );
                const posX = (i * 2.8) + (Math.random() - 0.5) * 1.2;
                const posZ = (j * 2.8) + (Math.random() - 0.5) * 1.2;
                building.position.set(posX, height / 2, posZ);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                
                // Zapisz dane do kolizji
                buildings.push({
                    mesh: building,
                    x: posX - width/2,
                    z: posZ - depth/2,
                    x2: posX + width/2,
                    z2: posZ + depth/2,
                    width: width,
                    depth: depth
                });
                
                // Dach
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(width + 0.1, 0.15, depth + 0.1),
                    new THREE.MeshStandardMaterial({ color: 0xaa7c55, roughness: 0.5 })
                );
                roof.position.set(posX, height + 0.08, posZ);
                roof.castShadow = true;
                scene.add(roof);
                
                // Okna (dekoracja)
                const windowMat = new THREE.MeshStandardMaterial({ color: 0xffcc88, emissive: 0x442200 });
                for (let w = 0; w < 3; w++) {
                    const windowGeo = new THREE.BoxGeometry(0.35, 0.45, 0.05);
                    const windowObj = new THREE.Mesh(windowGeo, windowMat);
                    windowObj.position.set(posX - 0.4 + w * 0.4, height * 0.6, posZ + depth/2 + 0.03);
                    windowObj.castShadow = false;
                    scene.add(windowObj);
                    
                    const windowObj2 = new THREE.Mesh(windowGeo, windowMat);
                    windowObj2.position.set(posX - 0.4 + w * 0.4, height * 0.6, posZ - depth/2 - 0.03);
                    windowObj2.castShadow = false;
                    scene.add(windowObj2);
                }
            }
        }
        
        // Drzewa
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
        const foliageMat = new THREE.MeshStandardMaterial({ color: 0x5A9E4E });
        for (let t = 0; t < 250; t++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 16 + Math.random() * 30;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (Math.abs(x) < 9 && Math.abs(z) < 9) continue;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.55, 1.0, 6), trunkMat);
            trunk.position.set(x, 0.45, z);
            trunk.castShadow = true;
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.9, 8), foliageMat);
            foliage.position.set(x, 1.0, z);
            foliage.castShadow = true;
            scene.add(trunk);
            scene.add(foliage);
        }
        
        // ---------- TWORZENIE GRAFIK DLA AUT (kolorowe, atrakcyjne) ----------
        // Zamiast wczytywania zewnętrznych plików, tworzymy dynamiczne canvas z numerami
        function createCarTexture(color, number, name) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Tło z gradientem
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, color);
            grad.addColorStop(1, this.adjustBrightness ? this.adjustBrightness(color, -20) : color);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ramka chromowana
            ctx.strokeStyle = '#FFD966';
            ctx.lineWidth = 25;
            ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
            
            // Główne okno
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(canvas.width * 0.2, canvas.height * 0.3, canvas.width * 0.6, canvas.height * 0.4);
            
            // Reflektory
            ctx.fillStyle = '#FFD966';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.15, canvas.height * 0.5, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width * 0.85, canvas.height * 0.5, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Numer auta
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `Bold ${canvas.width * 0.25}px "Segoe UI"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`#${number}`, canvas.width / 2, canvas.height / 2);
            
            // Nazwa modelu
            ctx.font = `${canvas.width * 0.07}px "Segoe UI"`;
            ctx.fillStyle = '#FFDDAA';
            ctx.fillText(name, canvas.width / 2, canvas.height * 0.85);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }
        
        // Kolory dla 10 aut
        const carColors = [
            '#E34234', '#2E8B57', '#4682B4', '#DAA520', '#9370DB',
            '#FF69B4', '#20B2AA', '#FF8C00', '#6A5ACD', '#CD5C5C'
        ];
        const carNames = ['SPEEDSTER', 'PHANTOM', 'THUNDER', 'NOVA', 'STRIKE', 'BLAZE', 'SHADOW', 'TITAN', 'VIPER', 'COMET'];
        
        const carTextures = [];
        for (let i = 0; i < 10; i++) {
            const tex = createCarTexture(carColors[i], i + 1, carNames[i]);
            carTextures.push(tex);
        }
        
        // ---------- KLASA AUTA Z POPRAWNĄ KOLIZJĄ ----------
        class Car3D {
            constructor(scene, texture, colorFallback, isPlayer = false, name = "Auto") {
                this.scene = scene;
                this.isPlayer = isPlayer;
                this.speed = 0;
                this.angle = 0;
                this.maxSpeed = isPlayer ? 20 : 10;
                this.acceleration = isPlayer ? 30 : 14;
                this.turnSpeed = isPlayer ? 2.4 : 1.8;
                this.friction = 0.96;
                this.width = 0.9;
                this.length = 1.7;
                
                const geometry = new THREE.BoxGeometry(0.95, 0.5, 1.75);
                const material = new THREE.MeshStandardMaterial({ 
                    map: texture, 
                    roughness: 0.2, 
                    metalness: 0.8,
                    color: 0xffffff
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);
                
                // Dodanie świateł
                const lightMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 });
                const headlightL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8), lightMat);
                headlightL.position.set(-0.3, 0.2, 0.88);
                const headlightR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8), lightMat);
                headlightR.position.set(0.3, 0.2, 0.88);
                this.mesh.add(headlightL);
                this.mesh.add(headlightR);
                
                // CSS2D etykieta
                if (!isPlayer) {
                    const div = document.createElement('div');
                    div.textContent = `${name} 🚗`;
                    div.style.color = '#ffdd99';
                    div.style.fontSize = '12px';
                    div.style.fontWeight = 'bold';
                    div.style.textShadow = '1px 1px 0px black';
                    div.style.background = 'rgba(0,0,0,0.7)';
                    div.style.padding = '2px 10px';
                    div.style.borderRadius = '20px';
                    div.style.borderLeft = `3px solid ${carColors[Math.floor(Math.random() * carColors.length)]}`;
                    div.style.whiteSpace = 'nowrap';
                    this.label = new CSS2DObject(div);
                    scene.add(this.label);
                } else {
                    this.label = null;
                }
                
                this.position = new THREE.Vector3(0, 0.28, 0);
                this.mesh.position.copy(this.position);
                this.updateLabelPos();
            }
            
            updateLabelPos() {
                if (this.label) {
                    this.label.position.copy(this.position);
                    this.label.position.y += 0.9;
                }
            }
            
            setPosition(x, z) {
                this.position.set(x, 0.28, z);
                this.mesh.position.copy(this.position);
                this.updateLabelPos();
            }
            
            setRotation(angleRad) {
                this.angle = angleRad;
                this.mesh.rotation.y = angleRad;
            }
            
            // Sprawdzanie kolizji z budynkami
            checkCollisionWithBuildings(buildingsList, newX, newZ) {
                const carHalfW = this.width / 2;
                const carHalfL = this.length / 2;
                const carLeft = newX - carHalfW;
                const carRight = newX + carHalfW;
                const carTop = newZ - carHalfL;
                const carBottom = newZ + carHalfL;
                
                for (let b of buildingsList) {
                    if (carRight > b.x && carLeft < b.x2 && carBottom > b.z && carTop < b.z2) {
                        return true;
                    }
                }
                return false;
            }
            
            update(deltaTime, keysPressed = null, aiBehavior = null) {
                if (!deltaTime || deltaTime > 0.033) deltaTime = 0.016;
                
                let acc = 0;
                let turn = 0;
                
                if (this.isPlayer && keysPressed) {
                    if (keysPressed['KeyW'] || keysPressed['ArrowUp']) acc = 1;
                    if (keysPressed['KeyS'] || keysPressed['ArrowDown']) acc = -1;
                    if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) turn = 1;
                    if (keysPressed['KeyD'] || keysPressed['ArrowRight']) turn = -1;
                } else if (!this.isPlayer && aiBehavior) {
                    // AI losowo zmienia kierunek co jakiś czas
                    if (!this.aiTimer) this.aiTimer = 0;
                    this.aiTimer += deltaTime;
                    if (this.aiTimer > 2.5) {
                        this.aiTimer = 0;
                        this.aiTargetAngle = this.angle + (Math.random() - 0.5) * 1.8;
                    }
                    if (this.aiTargetAngle === undefined) this.aiTargetAngle = this.angle;
                    
                    let angleDiff = this.aiTargetAngle - this.angle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    turn = Math.min(0.8, Math.max(-0.8, angleDiff * 2.0));
                    acc = 0.6 + Math.random() * 0.3;
                }
                
                if (acc !== 0) {
                    this.speed += acc * this.acceleration * deltaTime;
                    this.speed = Math.min(Math.max(this.speed, -this.maxSpeed * 0.5), this.maxSpeed);
                } else {
                    this.speed *= this.friction;
                    if (Math.abs(this.speed) < 0.2) this.speed = 0;
                }
                
                if (turn !== 0 && Math.abs(this.speed) > 0.5) {
                    this.angle += turn * this.turnSpeed * deltaTime * (Math.abs(this.speed) / this.maxSpeed);
                }
                
                const moveX = Math.sin(this.angle) * this.speed * deltaTime;
                const moveZ = Math.cos(this.angle) * this.speed * deltaTime;
                let newX = this.position.x + moveX;
                let newZ = this.position.z + moveZ;
                
                // Granice miasta
                const bound = 48;
                newX = Math.min(Math.max(newX, -bound), bound);
                newZ = Math.min(Math.max(newZ, -bound), bound);
                
                // KOLIZJA Z BUDYNKAMI
                if (!this.checkCollisionWithBuildings(buildings, newX, newZ)) {
                    this.position.set(newX, 0.28, newZ);
                } else {
                    // Kolizja - odbicie i strata prędkości
                    this.speed *= -0.4;
                    if (Math.abs(this.speed) < 0.8) this.speed = 0;
                    // Próba cofnięcia
                    const backX = this.position.x - moveX * 0.8;
                    const backZ = this.position.z - moveZ * 0.8;
                    if (!this.checkCollisionWithBuildings(buildings, backX, backZ)) {
                        this.position.set(backX, 0.28, backZ);
                    }
                }
                
                this.mesh.position.copy(this.position);
                this.mesh.rotation.y = this.angle;
                this.updateLabelPos();
            }
        }
        
        // ---------- GRACZ ----------
        let playerCar = new Car3D(scene, carTextures[0], 0xe34234, true, "TWOJE AUTO");
        playerCar.setPosition(0, 0);
        playerCar.setRotation(0);
        
        // ---------- AUTA AI (10 sztuk, losowe poruszanie) ----------
        const aiCars = [];
        for (let i = 0; i < 10; i++) {
            const tex = carTextures[i % carTextures.length];
            const aiCar = new Car3D(scene, tex, 0x77aaff, false, carNames[i % carNames.length]);
            // Rozstawienie po mieście z dala od centrum
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 30) {
                const angleRad = Math.random() * Math.PI * 2;
                const radius = 12 + Math.random() * 30;
                const x = Math.cos(angleRad) * radius;
                const z = Math.sin(angleRad) * radius;
                // Sprawdź kolizję z budynkami przy starcie
                const carHalfW = 0.45, carHalfL = 0.85;
                let collision = false;
                for (let b of buildings) {
                    if (x + carHalfW > b.x && x - carHalfW < b.x2 && 
                        z + carHalfL > b.z && z - carHalfL < b.z2) {
                        collision = true;
                        break;
                    }
                }
                if (!collision && Math.abs(x) < 45 && Math.abs(z) < 45) {
                    aiCar.setPosition(x, z);
                    aiCar.setRotation(Math.random() * Math.PI * 2);
                    placed = true;
                }
                attempts++;
            }
            if (!placed) {
                aiCar.setPosition(15, 15);
                aiCar.setRotation(0);
            }
            aiCars.push(aiCar);
        }
        
        // ---------- STEROWANIE ----------
        const keyState = {
            KeyW: false, KeyS: false, KeyA: false, KeyD: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
        };
        
        window.addEventListener('keydown', (e) => {
            const code = e.code;
            if (keyState.hasOwnProperty(code)) {
                keyState[code] = true;
                e.preventDefault();
            }
            if (code === 'Escape') {
                controls.enabled = true;
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            const code = e.code;
            if (keyState.hasOwnProperty(code)) keyState[code] = false;
        });
        
        // ---------- WYBÓR AUTA ----------
        function updatePlayerCar(index) {
            const newTex = carTextures[index];
            if (newTex && playerCar.mesh.material) {
                playerCar.mesh.material.map = newTex;
                playerCar.mesh.material.needsUpdate = true;
            }
            document.querySelectorAll('.car-btn').forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        
        // Budowanie UI
        const selectorDiv = document.getElementById('carSelector');
        for (let i = 0; i < 10; i++) {
            const btn = document.createElement('button');
            btn.className = 'car-btn';
            if (i === 0) btn.classList.add('active');
            const img = document.createElement('img');
            // Tworzymy miniaturkę z canvas
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 100;
            thumbCanvas.height = 100;
            const tCtx = thumbCanvas.getContext('2d');
            tCtx.fillStyle = carColors[i];
            tCtx.fillRect(0, 0, 100, 100);
            tCtx.fillStyle = '#FFD966';
            tCtx.font = 'bold 40px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText(`${i+1}`, 50, 65);
            img.src = thumbCanvas.toDataURL();
            const span = document.createElement('span');
            span.textContent = carNames[i];
            btn.appendChild(img);
            btn.appendChild(span);
            btn.addEventListener('click', () => updatePlayerCar(i));
            selectorDiv.appendChild(btn);
        }
        
        // ---------- PĘTLA GRY ----------
        let lastTime = performance.now();
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            // Aktualizacja gracza
            playerCar.update(delta, keyState);
            
            // Aktualizacja AI (losowe zachowanie, nie jadą za graczem)
            for (let ai of aiCars) {
                ai.update(delta, null, { type: 'random' });
                
                // Kolizje między AI a graczem
                if (playerCar.position.distanceTo(ai.position) < 1.1) {
                    const dir = new THREE.Vector3().subVectors(playerCar.position, ai.position).normalize();
                    playerCar.speed *= -0.4;
                    ai.speed *= -0.3;
                    playerCar.position.addScaledVector(dir, 0.25);
                    ai.position.addScaledVector(dir, -0.2);
                    playerCar.mesh.position.copy(playerCar.position);
                    ai.mesh.position.copy(ai.position);
                    playerCar.updateLabelPos();
                    ai.updateLabelPos();
                }
                
                // Kolizje między AI a AI
                for (let other of aiCars) {
                    if (other === ai) continue;
                    if (ai.position.distanceTo(other.position) < 1.0) {
                        const dir = new THREE.Vector3().subVectors(ai.position, other.position).normalize();
                        ai.position.addScaledVector(dir, 0.12);
                        other.position.addScaledVector(dir, -0.12);
                        ai.mesh.position.copy(ai.position);
                        other.mesh.position.copy(other.position);
                    }
                }
            }
            
            // Aktualizacja kamery
            controls.target.lerp(playerCar.position, 0.08);
            controls.update();
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }
        
        controls.target.set(0, 0, 0);
        camera.position.set(12, 9, 15);
        controls.update();
        
        // Gwiazdy
        const stars = new THREE.Points(
            new THREE.BufferGeometry(),
            new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 })
        );
        const starPos = [];
        for (let i = 0; i < 1200; i++) {
            starPos.push((Math.random() - 0.5) * 400);
            starPos.push((Math.random() - 0.5) * 100 + 20);
            starPos.push((Math.random() - 0.5) * 200 - 80);
        }
        stars.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
        scene.add(stars);
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('Gra uruchomiona! Kolizje z budynkami działają, AI jeździ losowo, wysokie budynki!');
    </script>
</body>
</html>
