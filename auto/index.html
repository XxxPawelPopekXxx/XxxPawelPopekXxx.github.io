<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D City Drive - JASNA WERSJA | kolizje | AI losowe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            background: #0a2f2a;
        }
        
        .car-selector-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 200, 100, 0.8);
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        
        .car-btn {
            background: #2a3a38;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .car-btn img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            pointer-events: none;
            background: linear-gradient(135deg, #4a6b62, #2a4a42);
            border-radius: 12px;
            padding: 5px;
        }
        
        .car-btn span {
            font-size: 11px;
            font-weight: bold;
            color: #ffecb3;
            background: #000000aa;
            padding: 2px 10px;
            border-radius: 20px;
        }
        
        .car-btn.active {
            background: #f5a623;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px #ffdd99, 0 0 0 4px #2c4a44;
        }
        
        .car-btn.active span {
            color: #2c1e0a;
            background: #ffefc0;
        }
        
        .controls-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffdd99;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border-left: 3px solid #f5a623;
        }
        
        .controls-info kbd {
            background: #2a3a38;
            padding: 2px 8px;
            border-radius: 20px;
            margin: 0 2px;
            font-weight: bold;
            color: #ffdd99;
        }
        
        .title {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 6px 15px;
            border-radius: 30px;
            color: #ffdd99;
            font-weight: bold;
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        
        @media (max-width: 800px) {
            .car-btn img { width: 40px; height: 40px; }
            .car-btn span { font-size: 9px; }
            .car-selector-panel { padding: 8px 12px; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="title">🚗 CITY DRIVE 3D | JASNE MIASTO | AI LOSOWE</div>
    <div class="controls-info">
        🖱️ <kbd>MYSZKA</kbd> obrót kamery &nbsp;&nbsp;|&nbsp;&nbsp;
        <kbd>W A S D</kbd> jazda &nbsp;&nbsp;|&nbsp;&nbsp;
        <kbd>ESC</kbd> odblokuj kursor
    </div>
    <div class="car-selector-panel" id="carSelector"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- KONFIGURACJA SCENY - JASNE KOLORY ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // JASNE NIEBO
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002); // Lekka mgiełka
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 9, 15);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // ---------- JASNE OŚWIETLENIE ----------
        // Ambient - jasne światło otoczenia
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        
        // Główne światło słoneczne
        const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.5);
        sunLight.position.set(20, 30, 15);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 60;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        scene.add(sunLight);
        
        // Dodatkowe światło wypełniające od dołu
        const fillLight = new THREE.PointLight(0x88aaff, 0.6);
        fillLight.position.set(0, 5, 0);
        scene.add(fillLight);
        
        // Światło z tyłu dla podświetlenia
        const backLight2 = new THREE.PointLight(0xffaa77, 0.5);
        backLight2.position.set(-5, 8, -8);
        scene.add(backLight2);
        
        // Światło z boku
        const sideLight = new THREE.PointLight(0xffcc88, 0.5);
        sideLight.position.set(12, 6, 5);
        scene.add(sideLight);
        
        // ---------- PODŁOŻE (JASNY ASFALT) ----------
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(220, 220),
            new THREE.MeshStandardMaterial({ color: 0x5a7a6e, roughness: 0.6, metalness: 0.05 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.2;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        // Siatka dróg (ciemniejszy asfalt dla kontrastu)
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x3a4a44, roughness: 0.5 });
        const roadWidth = 2.2;
        const roads = [
            { x: 0, z: -28, w: 220, h: roadWidth },
            { x: 0, z: -14, w: 220, h: roadWidth },
            { x: 0, z: 0, w: 220, h: roadWidth },
            { x: 0, z: 14, w: 220, h: roadWidth },
            { x: 0, z: 28, w: 220, h: roadWidth },
            { x: -28, z: 0, w: roadWidth, h: 220 },
            { x: -14, z: 0, w: roadWidth, h: 220 },
            { x: 0, z: 0, w: roadWidth, h: 220 },
            { x: 14, z: 0, w: roadWidth, h: 220 },
            { x: 28, z: 0, w: roadWidth, h: 220 }
        ];
        roads.forEach(road => {
            const block = new THREE.Mesh(new THREE.BoxGeometry(road.w, 0.1, road.h), roadMaterial);
            block.position.set(road.x, -0.1, road.z);
            block.receiveShadow = true;
            scene.add(block);
        });
        
        // Linie na drogach (żółte)
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffdd77, emissive: 0x442200 });
        for (let z = -55; z <= 55; z += 4) {
            if (Math.abs(z) < 3) continue;
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 3.5), lineMat);
            line.position.set(0, 0.08, z);
            scene.add(line);
        }
        for (let x = -55; x <= 55; x += 4) {
            if (Math.abs(x) < 3) continue;
            const lineV = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.08, 0.25), lineMat);
            lineV.position.set(x, 0.08, 0);
            scene.add(lineV);
        }
        
        // ---------- WYSOKIE BUDYNKI (JASNE KOLORY) ----------
        const buildingColors = [
            0xc9a87c, 0xb89a6e, 0xa88b62, 0x9d7e58, 0x8d6b48,
            0x7c8f7a, 0x6c8b72, 0x5a7d68, 0x8b9a7a, 0x9aae8a
        ];
        const buildings = [];
        
        for (let i = -12; i <= 12; i++) {
            for (let j = -12; j <= 12; j++) {
                const distToCenter = Math.hypot(i * 2.5, j * 2.5);
                if (distToCenter < 8) continue;
                if (Math.random() > 0.6) continue;
                
                const width = 1.3 + Math.random() * 1.1;
                const depth = 1.3 + Math.random() * 1.1;
                const height = 1.8 + Math.random() * 2.8;
                const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, depth),
                    new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.1 })
                );
                const posX = (i * 2.8) + (Math.random() - 0.5) * 1.2;
                const posZ = (j * 2.8) + (Math.random() - 0.5) * 1.2;
                building.position.set(posX, height / 2, posZ);
                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);
                
                buildings.push({
                    mesh: building,
                    x: posX - width/2,
                    z: posZ - depth/2,
                    x2: posX + width/2,
                    z2: posZ + depth/2,
                    width: width,
                    depth: depth
                });
                
                // Dach (czerwony/brązowy)
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(width + 0.1, 0.12, depth + 0.1),
                    new THREE.MeshStandardMaterial({ color: 0xcc8866, roughness: 0.4 })
                );
                roof.position.set(posX, height + 0.06, posZ);
                roof.castShadow = true;
                scene.add(roof);
                
                // Okna (jasne)
                const windowMat = new THREE.MeshStandardMaterial({ color: 0xffdd99, emissive: 0x331100 });
                for (let w = 0; w < 3; w++) {
                    const windowGeo = new THREE.BoxGeometry(0.35, 0.45, 0.05);
                    const windowObj = new THREE.Mesh(windowGeo, windowMat);
                    windowObj.position.set(posX - 0.4 + w * 0.4, height * 0.6, posZ + depth/2 + 0.03);
                    windowObj.castShadow = false;
                    scene.add(windowObj);
                    
                    const windowObj2 = new THREE.Mesh(windowGeo, windowMat);
                    windowObj2.position.set(posX - 0.4 + w * 0.4, height * 0.6, posZ - depth/2 - 0.03);
                    windowObj2.castShadow = false;
                    scene.add(windowObj2);
                }
            }
        }
        
        // Drzewa (zielone)
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
        const foliageMat = new THREE.MeshStandardMaterial({ color: 0x6AAB4E });
        for (let t = 0; t < 300; t++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 15 + Math.random() * 32;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (Math.abs(x) < 9 && Math.abs(z) < 9) continue;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.55, 1.1, 6), trunkMat);
            trunk.position.set(x, 0.5, z);
            trunk.castShadow = true;
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.0, 8), foliageMat);
            foliage.position.set(x, 1.1, z);
            foliage.castShadow = true;
            scene.add(trunk);
            scene.add(foliage);
        }
        
        // Trawa / krzaki
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x6cae6c });
        for (let g = 0; g < 400; g++) {
            const x = (Math.random() - 0.5) * 90;
            const z = (Math.random() - 0.5) * 90;
            if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
            const bush = new THREE.Mesh(new THREE.SphereGeometry(0.2 + Math.random() * 0.2, 5), grassMat);
            bush.position.set(x, 0, z);
            bush.castShadow = false;
            scene.add(bush);
        }
        
        // ---------- TWORZENIE KOLOROWYCH TEKSTUR DLA AUT ----------
        function createCarTexture(color, number, name) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Jasne tło z gradientem
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, color);
            grad.addColorStop(1, this.adjustBrightness ? this.adjustBrightness(color, -30) : color);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Chromowana ramka
            ctx.strokeStyle = '#FFD966';
            ctx.lineWidth = 20;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            
            // Okno
            ctx.fillStyle = '#AADDFF';
            ctx.fillRect(canvas.width * 0.2, canvas.height * 0.28, canvas.width * 0.6, canvas.height * 0.44);
            
            // Reflektory
            ctx.fillStyle = '#FFDD88';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.12, canvas.height * 0.5, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width * 0.88, canvas.height * 0.5, 28, 0, Math.PI * 2);
            ctx.fill();
            
            // Numer
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `Bold ${canvas.width * 0.28}px "Segoe UI"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${number}`, canvas.width / 2, canvas.height / 2);
            
            // Nazwa
            ctx.font = `${canvas.width * 0.08}px "Segoe UI"`;
            ctx.fillStyle = '#FFEEBB';
            ctx.fillText(name, canvas.width / 2, canvas.height * 0.85);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }
        
        const carColors = [
            '#E34D3A', '#3A9B6E', '#4A8FC4', '#E5B83C', '#B87CD6',
            '#F57CB3', '#38C9B8', '#FF9F4A', '#7A5FC0', '#D65C5C'
        ];
        const carNames = ['SPEED', 'PHANTOM', 'THUNDER', 'NOVA', 'STRIKE', 'BLAZE', 'SHADOW', 'TITAN', 'VIPER', 'COMET'];
        
        const carTextures = [];
        for (let i = 0; i < 10; i++) {
            const tex = createCarTexture(carColors[i], i + 1, carNames[i]);
            carTextures.push(tex);
        }
        
        // ---------- KLASA AUTA ----------
        class Car3D {
            constructor(scene, texture, colorFallback, isPlayer = false, name = "Auto") {
                this.scene = scene;
                this.isPlayer = isPlayer;
                this.speed = 0;
                this.angle = 0;
                this.maxSpeed = isPlayer ? 22 : 11;
                this.acceleration = isPlayer ? 32 : 15;
                this.turnSpeed = isPlayer ? 2.5 : 1.9;
                this.friction = 0.96;
                this.width = 0.9;
                this.length = 1.7;
                
                const geometry = new THREE.BoxGeometry(0.95, 0.52, 1.75);
                const material = new THREE.MeshStandardMaterial({ 
                    map: texture, 
                    roughness: 0.25, 
                    metalness: 0.75,
                    color: 0xffffff
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);
                
                // Światła
                const lightMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x552200 });
                const headlightL = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8), lightMat);
                headlightL.position.set(-0.32, 0.22, 0.9);
                const headlightR = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8), lightMat);
                headlightR.position.set(0.32, 0.22, 0.9);
                this.mesh.add(headlightL);
                this.mesh.add(headlightR);
                
                // Etykieta dla AI
                if (!isPlayer) {
                    const div = document.createElement('div');
                    div.textContent = `${name} 🚘`;
                    div.style.color = '#FFDD99';
                    div.style.fontSize = '12px';
                    div.style.fontWeight = 'bold';
                    div.style.textShadow = '1px 1px 0px black';
                    div.style.background = 'rgba(0,0,0,0.7)';
                    div.style.padding = '2px 12px';
                    div.style.borderRadius = '25px';
                    div.style.borderLeft = `3px solid ${carColors[Math.floor(Math.random() * carColors.length)]}`;
                    div.style.whiteSpace = 'nowrap';
                    this.label = new CSS2DObject(div);
                    scene.add(this.label);
                } else {
                    this.label = null;
                }
                
                this.position = new THREE.Vector3(0, 0.3, 0);
                this.mesh.position.copy(this.position);
                this.updateLabelPos();
            }
            
            updateLabelPos() {
                if (this.label) {
                    this.label.position.copy(this.position);
                    this.label.position.y += 0.95;
                }
            }
            
            setPosition(x, z) {
                this.position.set(x, 0.3, z);
                this.mesh.position.copy(this.position);
                this.updateLabelPos();
            }
            
            setRotation(angleRad) {
                this.angle = angleRad;
                this.mesh.rotation.y = angleRad;
            }
            
            checkCollisionWithBuildings(buildingsList, newX, newZ) {
                const carHalfW = this.width / 2;
                const carHalfL = this.length / 2;
                const carLeft = newX - carHalfW;
                const carRight = newX + carHalfW;
                const carTop = newZ - carHalfL;
                const carBottom = newZ + carHalfL;
                
                for (let b of buildingsList) {
                    if (carRight > b.x && carLeft < b.x2 && carBottom > b.z && carTop < b.z2) {
                        return true;
                    }
                }
                return false;
            }
            
            update(deltaTime, keysPressed = null) {
                if (!deltaTime || deltaTime > 0.033) deltaTime = 0.016;
                
                let acc = 0;
                let turn = 0;
                
                if (this.isPlayer && keysPressed) {
                    if (keysPressed['KeyW'] || keysPressed['ArrowUp']) acc = 1;
                    if (keysPressed['KeyS'] || keysPressed['ArrowDown']) acc = -1;
                    if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) turn = 1;
                    if (keysPressed['KeyD'] || keysPressed['ArrowRight']) turn = -1;
                } else if (!this.isPlayer) {
                    // AI losowe zachowanie
                    if (!this.aiTimer) this.aiTimer = 0;
                    if (!this.aiTargetAngle) this.aiTargetAngle = this.angle;
                    
                    this.aiTimer += deltaTime;
                    if (this.aiTimer > 2.2) {
                        this.aiTimer = 0;
                        this.aiTargetAngle = this.angle + (Math.random() - 0.5) * 2.2;
                    }
                    
                    let angleDiff = this.aiTargetAngle - this.angle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    turn = Math.min(0.7, Math.max(-0.7, angleDiff * 1.8));
                    acc = 0.55 + Math.random() * 0.35;
                }
                
                if (acc !== 0) {
                    this.speed += acc * this.acceleration * deltaTime;
                    this.speed = Math.min(Math.max(this.speed, -this.maxSpeed * 0.5), this.maxSpeed);
                } else {
                    this.speed *= this.friction;
                    if (Math.abs(this.speed) < 0.2) this.speed = 0;
                }
                
                if (turn !== 0 && Math.abs(this.speed) > 0.8) {
                    this.angle += turn * this.turnSpeed * deltaTime * (Math.abs(this.speed) / this.maxSpeed);
                }
                
                const moveX = Math.sin(this.angle) * this.speed * deltaTime;
                const moveZ = Math.cos(this.angle) * this.speed * deltaTime;
                let newX = this.position.x + moveX;
                let newZ = this.position.z + moveZ;
                
                // Granice
                const bound = 52;
                newX = Math.min(Math.max(newX, -bound), bound);
                newZ = Math.min(Math.max(newZ, -bound), bound);
                
                // Kolizja z budynkami
                if (!this.checkCollisionWithBuildings(buildings, newX, newZ)) {
                    this.position.set(newX, 0.3, newZ);
                } else {
                    this.speed *= -0.35;
                    if (Math.abs(this.speed) < 0.8) this.speed = 0;
                    const backX = this.position.x - moveX * 0.7;
                    const backZ = this.position.z - moveZ * 0.7;
                    if (!this.checkCollisionWithBuildings(buildings, backX, backZ)) {
                        this.position.set(backX, 0.3, backZ);
                    }
                }
                
                this.mesh.position.copy(this.position);
                this.mesh.rotation.y = this.angle;
                this.updateLabelPos();
            }
        }
        
        // ---------- GRACZ ----------
        let playerCar = new Car3D(scene, carTextures[0], 0xe34d3a, true, "TWOJE AUTO");
        playerCar.setPosition(0, 0);
        playerCar.setRotation(0);
        
        // ---------- AUTA AI ----------
        const aiCars = [];
        for (let i = 0; i < 10; i++) {
            const tex = carTextures[i % carTextures.length];
            const aiCar = new Car3D(scene, tex, 0x77aaff, false, carNames[i % carNames.length]);
            
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 40) {
                const angleRad = Math.random() * Math.PI * 2;
                const radius = 12 + Math.random() * 32;
                const x = Math.cos(angleRad) * radius;
                const z = Math.sin(angleRad) * radius;
                let collision = false;
                for (let b of buildings) {
                    if (x + 0.5 > b.x && x - 0.5 < b.x2 && z + 0.8 > b.z && z - 0.8 < b.z2) {
                        collision = true;
                        break;
                    }
                }
                if (!collision && Math.abs(x) < 50 && Math.abs(z) < 50) {
                    aiCar.setPosition(x, z);
                    aiCar.setRotation(Math.random() * Math.PI * 2);
                    placed = true;
                }
                attempts++;
            }
            if (!placed) {
                aiCar.setPosition(12 + (i * 3) % 40, 12 + (i * 5) % 40);
            }
            aiCars.push(aiCar);
        }
        
        // ---------- STEROWANIE ----------
        const keyState = {
            KeyW: false, KeyS: false, KeyA: false, KeyD: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
        };
        
        window.addEventListener('keydown', (e) => {
            const code = e.code;
            if (keyState.hasOwnProperty(code)) {
                keyState[code] = true;
                e.preventDefault();
            }
            if (code === 'Escape') {
                controls.enabled = true;
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            const code = e.code;
            if (keyState.hasOwnProperty(code)) keyState[code] = false;
        });
        
        // ---------- WYBÓR AUTA ----------
        function updatePlayerCar(index) {
            const newTex = carTextures[index];
            if (newTex && playerCar.mesh.material) {
                playerCar.mesh.material.map = newTex;
                playerCar.mesh.material.needsUpdate = true;
            }
            document.querySelectorAll('.car-btn').forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        
        // UI
        const selectorDiv = document.getElementById('carSelector');
        for (let i = 0; i < 10; i++) {
            const btn = document.createElement('button');
            btn.className = 'car-btn';
            if (i === 0) btn.classList.add('active');
            const img = document.createElement('img');
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 100;
            thumbCanvas.height = 100;
            const tCtx = thumbCanvas.getContext('2d');
            tCtx.fillStyle = carColors[i];
            tCtx.fillRect(0, 0, 100, 100);
            tCtx.fillStyle = '#FFDD99';
            tCtx.font = 'bold 42px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText(`${i+1}`, 50, 68);
            img.src = thumbCanvas.toDataURL();
            const span = document.createElement('span');
            span.textContent = carNames[i];
            btn.appendChild(img);
            btn.appendChild(span);
            btn.addEventListener('click', () => updatePlayerCar(i));
            selectorDiv.appendChild(btn);
        }
        
        // ---------- KONTROLKI ORBIT ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.9;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 26;
        controls.target.set(0, 0, 0);
        
        // ---------- PĘTLA GRY ----------
        let lastTime = performance.now();
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            playerCar.update(delta, keyState);
            
            for (let ai of aiCars) {
                ai.update(delta, null);
                
                // Kolizja gracz-AI
                if (playerCar.position.distanceTo(ai.position) < 1.15) {
                    const dir = new THREE.Vector3().subVectors(playerCar.position, ai.position).normalize();
                    playerCar.speed *= -0.4;
                    ai.speed *= -0.35;
                    playerCar.position.addScaledVector(dir, 0.28);
                    ai.position.addScaledVector(dir, -0.22);
                    playerCar.mesh.position.copy(playerCar.position);
                    ai.mesh.position.copy(ai.position);
                }
                
                // Kolizje AI-AI
                for (let other of aiCars) {
                    if (other === ai) continue;
                    if (ai.position.distanceTo(other.position) < 1.05) {
                        const dir = new THREE.Vector3().subVectors(ai.position, other.position).normalize();
                        ai.position.addScaledVector(dir, 0.12);
                        other.position.addScaledVector(dir, -0.12);
                        ai.mesh.position.copy(ai.position);
                        other.mesh.position.copy(other.position);
                    }
                }
            }
            
            // Kamera podąża za graczem
            controls.target.lerp(playerCar.position, 0.1);
            controls.update();
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }
        
        controls.target.set(0, 0, 0);
        camera.position.set(14, 10, 16);
        controls.update();
        
        // Dekoracje - chmury
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeeeeee });
        for (let c = 0; c < 30; c++) {
            const cloudGroup = new THREE.Group();
            const cloudX = (Math.random() - 0.5) * 180;
            const cloudZ = (Math.random() - 0.5) * 150 - 50;
            const cloudY = 18 + Math.random() * 10;
            const parts = 3 + Math.floor(Math.random() * 3);
            for (let p = 0; p < parts; p++) {
                const part = new THREE.Mesh(new THREE.SphereGeometry(0.6 + Math.random() * 0.5, 7), cloudMat);
                part.position.set((Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 1);
                cloudGroup.add(part);
            }
            cloudGroup.position.set(cloudX, cloudY, cloudZ);
            scene.add(cloudGroup);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('Gra uruchomiona! Jasne kolory, kolizje działają, AI losowo jeździ.');
    </script>
</body>
</html>
