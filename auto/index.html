<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Drive 2D - prosta gra z autami</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a3d2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .game-wrapper {
            background: #1a2f2a;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background-color: #2d6a4f;
            cursor: crosshair;
        }

        .panel {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #0f1e1a;
            padding: 10px 20px;
            border-radius: 50px;
        }

        .car-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .car-btn {
            background: #2c4a3e;
            border: none;
            border-radius: 40px;
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: white;
            font-size: 10px;
        }

        .car-btn.active {
            background: #e67e22;
            transform: scale(1.05);
            box-shadow: 0 0 0 2px #ffaa44;
        }

        .car-preview {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .controls {
            background: #000000aa;
            padding: 5px 15px;
            border-radius: 30px;
            color: #ffdd99;
            font-size: 12px;
        }

        kbd {
            background: #2c4a3e;
            padding: 2px 8px;
            border-radius: 5px;
            margin: 0 2px;
        }

        .status {
            color: #ffdd99;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="panel">
        <div class="status" id="statusText">🚗 Auto 1</div>
        <div class="car-buttons" id="carButtons"></div>
        <div class="controls">🎮 <kbd>W A S D</kbd> lub <kbd>⬆️ ⬇️ ⬅️ ➡️</kbd> | 🖱️ myszka niepotrzebna</div>
    </div>
</div>

<script>
    (function() {
        // ---------- KONFIGURACJA ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Wymiary świata (większe niż canvas)
        const WORLD_W = 2400;
        const WORLD_H = 1800;
        
        // Kamera
        let cameraX = 0, cameraY = 0;
        
        // Parametry gry
        let gameRunning = true;
        
        // ---------- DANE AUT ----------
        const carColors = [
            '#E34D3A', '#3A9B6E', '#4A8FC4', '#E5B83C', '#B87CD6',
            '#F57CB3', '#38C9B8', '#FF9F4A', '#7A5FC0', '#D65C5C'
        ];
        const carNames = ['SPEED', 'PHANTOM', 'THUNDER', 'NOVA', 'STRIKE', 'BLAZE', 'SHADOW', 'TITAN', 'VIPER', 'COMET'];
        
        // Gracz
        let player = {
            x: WORLD_W / 2,
            y: WORLD_H / 2,
            angle: 0,
            speed: 0,
            maxSpeed: 280,
            acceleration: 500,
            turnSpeed: 2.6,
            friction: 0.97,
            width: 32,
            height: 28,
            selectedCar: 0
        };
        
        // ---------- BUDYNKI (z kolizją) ----------
        let buildings = [];
        
        function generateCity() {
            buildings = [];
            
            // Generuj budynki w siatce
            for (let i = 0; i < 180; i++) {
                const x = 80 + Math.random() * (WORLD_W - 160);
                const y = 80 + Math.random() * (WORLD_H - 160);
                const w = 40 + Math.random() * 50;
                const h = 40 + Math.random() * 50;
                
                // Sprawdź czy nie za blisko innych budynków (proste)
                let tooClose = false;
                for (let b of buildings) {
                    if (Math.abs(b.x - x) < 70 && Math.abs(b.y - y) < 70) {
                        tooClose = true;
                        break;
                    }
                }
                // Unikaj centrum startowego
                if (Math.abs(x - WORLD_W/2) < 150 && Math.abs(y - WORLD_H/2) < 150) tooClose = true;
                
                if (!tooClose && i % 3 !== 0) {
                    buildings.push({
                        x: x, y: y, w: w, h: h,
                        color: `hsl(${30 + Math.random() * 30}, 55%, 45%)`
                    });
                }
            }
            
            // Dodaj więcej budynków wokół
            for (let i = 0; i < 100; i++) {
                const x = 50 + Math.random() * (WORLD_W - 100);
                const y = 50 + Math.random() * (WORLD_H - 100);
                const w = 35 + Math.random() * 45;
                const h = 35 + Math.random() * 45;
                let ok = true;
                for (let b of buildings) {
                    if (Math.abs(b.x - x) < 60 && Math.abs(b.y - y) < 60) ok = false;
                }
                if (ok && (Math.abs(x - WORLD_W/2) > 120 || Math.abs(y - WORLD_H/2) > 120)) {
                    buildings.push({
                        x: x, y: y, w: w, h: h,
                        color: `hsl(${25 + Math.random() * 40}, 60%, 42%)`
                    });
                }
            }
        }
        
        // ---------- AUTA AI ----------
        let aiCars = [];
        
        function createAICars() {
            aiCars = [];
            for (let i = 0; i < 12; i++) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 50) {
                    const x = 150 + Math.random() * (WORLD_W - 300);
                    const y = 150 + Math.random() * (WORLD_H - 300);
                    // Sprawdź kolizję z budynkami
                    let collides = false;
                    for (let b of buildings) {
                        if (x + 20 > b.x && x - 20 < b.x + b.w && y + 18 > b.y && y - 18 < b.y + b.h) {
                            collides = true;
                            break;
                        }
                    }
                    // Unikaj gracza
                    if (Math.abs(x - WORLD_W/2) < 100 && Math.abs(y - WORLD_H/2) < 100) collides = true;
                    
                    if (!collides) {
                        const carColor = carColors[i % carColors.length];
                        aiCars.push({
                            x: x, y: y,
                            angle: Math.random() * Math.PI * 2,
                            speed: 40 + Math.random() * 70,
                            maxSpeed: 100 + Math.random() * 60,
                            width: 28,
                            height: 24,
                            color: carColor,
                            name: carNames[i % carNames.length],
                            turnCooldown: Math.random() * 2
                        });
                        placed = true;
                    }
                    attempts++;
                }
                if (!placed) {
                    aiCars.push({
                        x: 200 + i * 50, y: 300 + (i % 5) * 60,
                        angle: Math.random() * Math.PI * 2,
                        speed: 50,
                        maxSpeed: 100,
                        width: 28,
                        height: 24,
                        color: carColors[i % carColors.length],
                        name: carNames[i % carNames.length],
                        turnCooldown: 0
                    });
                }
            }
        }
        
        // ---------- KOLIZJA Z BUDYNKAMI ----------
        function checkBuildingCollision(x, y, w, h) {
            for (let b of buildings) {
                if (x + w/2 > b.x && x - w/2 < b.x + b.w && y + h/2 > b.y && y - h/2 < b.y + b.h) {
                    return true;
                }
            }
            return false;
        }
        
        // ---------- RYSOWANIE MAPY ----------
        function drawMap() {
            // Tło - trawa
            ctx.fillStyle = '#3c8a6e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Drogi (szare pasy)
            ctx.fillStyle = '#4a5a54';
            // Główne drogi poziome
            for (let y = 150; y < WORLD_H; y += 280) {
                ctx.fillRect(0 - cameraX, y - 30 - cameraY, WORLD_W, 60);
                ctx.fillStyle = '#ffdd88';
                ctx.fillRect(0 - cameraX, y - cameraY, WORLD_W, 6);
                ctx.fillStyle = '#4a5a54';
            }
            // Główne drogi pionowe
            for (let x = 200; x < WORLD_W; x += 300) {
                ctx.fillRect(x - 30 - cameraX, 0 - cameraY, 60, WORLD_H);
                ctx.fillStyle = '#ffdd88';
                ctx.fillRect(x - cameraX, 0 - cameraY, 6, WORLD_H);
                ctx.fillStyle = '#4a5a54';
            }
            
            // Budynki
            for (let b of buildings) {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x - cameraX, b.y - cameraY, b.w, b.h);
                // Okna
                ctx.fillStyle = '#ffcc88';
                ctx.fillRect(b.x + 5 - cameraX, b.y + 5 - cameraY, b.w - 10, 8);
                ctx.fillStyle = '#88aaff';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(b.x + 8 + i*12 - cameraX, b.y + 18 - cameraY, 7, 10);
                }
                // Cień
                ctx.fillStyle = '#00000033';
                ctx.fillRect(b.x + 3 - cameraX, b.y + 3 - cameraY, b.w, b.h);
            }
            
            // Drzewa
            for (let i = 0; i < 300; i++) {
                const treeX = (i * 131) % WORLD_W;
                const treeY = (i * 253) % WORLD_H;
                let onBuilding = false;
                for (let b of buildings) {
                    if (treeX > b.x - 15 && treeX < b.x + b.w + 15 && treeY > b.y - 15 && treeY < b.y + b.h + 15) {
                        onBuilding = true;
                        break;
                    }
                }
                if (!onBuilding && (i % 7 !== 0)) {
                    ctx.fillStyle = '#4a8c3f';
                    ctx.beginPath();
                    ctx.arc(treeX - cameraX, treeY - cameraY, 9, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#8B5A2B';
                    ctx.fillRect(treeX - 4 - cameraX, treeY + 2 - cameraY, 8, 12);
                }
            }
        }
        
        // ---------- RYSOWANIE AUTA ----------
        function drawCar(x, y, angle, color, w, h, isPlayer = false, name = "") {
            ctx.save();
            ctx.translate(x - cameraX, y - cameraY);
            ctx.rotate(angle);
            
            // Karoseria
            ctx.fillStyle = color;
            ctx.fillRect(-w/2, -h/2, w, h);
            // Dach
            ctx.fillStyle = '#333333';
            ctx.fillRect(-w/2 + 5, -h/2 + 4, w - 10, h - 12);
            // Okna
            ctx.fillStyle = '#88ccff';
            ctx.fillRect(-w/2 + 8, -h/2 + 6, w - 16, 10);
            // Reflektory
            ctx.fillStyle = '#ffdd88';
            ctx.fillRect(-w/2 - 2, -5, 5, 8);
            ctx.fillRect(w/2 - 3, -5, 5, 8);
            // Koła
            ctx.fillStyle = '#222';
            ctx.fillRect(-w/2 - 2, -h/2 + 3, 6, 10);
            ctx.fillRect(w/2 - 4, -h/2 + 3, 6, 10);
            ctx.fillRect(-w/2 - 2, h/2 - 13, 6, 10);
            ctx.fillRect(w/2 - 4, h/2 - 13, 6, 10);
            
            // Numer auta (dla AI)
            if (!isPlayer && name) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px monospace';
                ctx.shadowBlur = 2;
                ctx.fillText(name[0], -5, -12);
                ctx.shadowBlur = 0;
            }
            
            ctx.restore();
        }
        
        // ---------- AKTUALIZACJA AUT AI ----------
        function updateAI(deltaTime) {
            for (let ai of aiCars) {
                // Losowa zmiana kierunku
                if (!ai.turnTimer) ai.turnTimer = 0;
                ai.turnTimer += deltaTime;
                if (ai.turnTimer > 1.5) {
                    ai.turnTimer = 0;
                    const change = (Math.random() - 0.5) * 1.2;
                    ai.angle += change;
                }
                
                // Przyspieszanie/zwalnianie
                if (Math.random() < 0.02) {
                    ai.speed += (Math.random() - 0.5) * 30;
                }
                ai.speed = Math.min(Math.max(ai.speed, 30), ai.maxSpeed);
                
                const moveX = Math.sin(ai.angle) * ai.speed * deltaTime;
                const moveY = Math.cos(ai.angle) * ai.speed * deltaTime;
                let newX = ai.x + moveX;
                let newY = ai.y + moveY;
                
                // Granice
                newX = Math.min(Math.max(newX, 40), WORLD_W - 40);
                newY = Math.min(Math.max(newY, 40), WORLD_H - 40);
                
                // Kolizja z budynkami
                let collides = false;
                for (let b of buildings) {
                    if (newX + 16 > b.x && newX - 16 < b.x + b.w && newY + 14 > b.y && newY - 14 < b.y + b.h) {
                        collides = true;
                        break;
                    }
                }
                
                if (!collides) {
                    ai.x = newX;
                    ai.y = newY;
                } else {
                    ai.speed *= -0.4;
                    ai.angle += (Math.random() - 0.5) * 1.0;
                }
                
                // Kolizja z graczem
                const dx = ai.x - player.x;
                const dy = ai.y - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 35) {
                    const angleToPlayer = Math.atan2(dy, dx);
                    player.speed *= -0.3;
                    ai.speed *= -0.3;
                    player.x += Math.cos(angleToPlayer) * 12;
                    player.y += Math.sin(angleToPlayer) * 12;
                    ai.x -= Math.cos(angleToPlayer) * 10;
                    ai.y -= Math.sin(angleToPlayer) * 10;
                }
            }
        }
        
        // ---------- STEROWANIE ----------
        const keys = {
            w: false, s: false, a: false, d: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
        };
        
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (keys.hasOwnProperty(e.code === 'ArrowUp' ? 'ArrowUp' : null)) {}
            e.preventDefault();
        });
        
        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if (keys.hasOwnProperty(key)) keys[key] = false;
            e.preventDefault();
        });
        
        // ---------- AKTUALIZACJA GRACZA ----------
        function updatePlayer(deltaTime) {
            let acc = 0;
            let turn = 0;
            
            if (keys.w || keys.ArrowUp) acc = 1;
            if (keys.s || keys.ArrowDown) acc = -1;
            if (keys.a || keys.ArrowLeft) turn = 1;
            if (keys.d || keys.ArrowRight) turn = -1;
            
            if (acc !== 0) {
                player.speed += acc * player.acceleration * deltaTime;
                player.speed = Math.min(Math.max(player.speed, -player.maxSpeed * 0.6), player.maxSpeed);
            } else {
                player.speed *= player.friction;
                if (Math.abs(player.speed) < 1) player.speed = 0;
            }
            
            if (turn !== 0 && Math.abs(player.speed) > 5) {
                player.angle += turn * player.turnSpeed * deltaTime * (Math.abs(player.speed) / player.maxSpeed);
            }
            
            const moveX = Math.sin(player.angle) * player.speed * deltaTime;
            const moveY = Math.cos(player.angle) * player.speed * deltaTime;
            let newX = player.x + moveX;
            let newY = player.y + moveY;
            
            // Granice
            newX = Math.min(Math.max(newX, 35), WORLD_W - 35);
            newY = Math.min(Math.max(newY, 35), WORLD_H - 35);
            
            // Kolizja z budynkami
            if (!checkBuildingCollision(newX, newY, player.width, player.height)) {
                player.x = newX;
                player.y = newY;
            } else {
                player.speed *= -0.4;
                if (Math.abs(player.speed) < 10) player.speed = 0;
            }
        }
        
        // ---------- KAMERA ----------
        function updateCamera() {
            cameraX = player.x - canvas.width / 2;
            cameraY = player.y - canvas.height / 2;
            cameraX = Math.min(Math.max(cameraX, 0), WORLD_W - canvas.width);
            cameraY = Math.min(Math.max(cameraY, 0), WORLD_H - canvas.height);
        }
        
        // ---------- RYSOWANIE WSZYSTKIEGO ----------
        function render() {
            drawMap();
            
            // Rysuj AI
            for (let ai of aiCars) {
                drawCar(ai.x, ai.y, ai.angle, ai.color, ai.width, ai.height, false, ai.name);
            }
            
            // Rysuj gracza
            const playerColor = carColors[player.selectedCar];
            drawCar(player.x, player.y, player.angle, playerColor, player.width, player.height, true);
            
            // Miniaturowa mapa (opcjonalnie)
            ctx.fillStyle = '#000000aa';
            ctx.fillRect(canvas.width - 110, 10, 100, 80);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(canvas.width - 105 + (player.x / WORLD_W) * 90, 15 + (player.y / WORLD_H) * 70, 5, 5);
        }
        
        // ---------- WYBÓR AUTA ----------
        function initCarSelector() {
            const container = document.getElementById('carButtons');
            const status = document.getElementById('statusText');
            
            for (let i = 0; i < 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'car-btn';
                if (i === 0) btn.classList.add('active');
                
                const preview = document.createElement('div');
                preview.className = 'car-preview';
                preview.style.background = carColors[i];
                preview.textContent = `${i+1}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = carNames[i];
                
                btn.appendChild(preview);
                btn.appendChild(nameSpan);
                
                btn.addEventListener('click', () => {
                    player.selectedCar = i;
                    status.innerHTML = `🚗 ${carNames[i]}`;
                    document.querySelectorAll('.car-btn').forEach((b, idx) => {
                        if (idx === i) b.classList.add('active');
                        else b.classList.remove('active');
                    });
                });
                
                container.appendChild(btn);
            }
        }
        
        // ---------- PĘTLA GRY ----------
        let lastTime = 0;
        
        function gameLoop(now) {
            if (!lastTime) lastTime = now;
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            
            updatePlayer(delta);
            updateAI(delta);
            updateCamera();
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // ---------- START ----------
        generateCity();
        createAICars();
        initCarSelector();
        
        // Ustaw gracza na środku
        player.x = WORLD_W / 2;
        player.y = WORLD_H / 2;
        player.angle = 0;
        player.speed = 0;
        
        updateCamera();
        requestAnimationFrame(gameLoop);
        
        console.log("Gra uruchomiona! Użyj WASD lub strzałek do jazdy.");
    })();
</script>
</body>
</html>
