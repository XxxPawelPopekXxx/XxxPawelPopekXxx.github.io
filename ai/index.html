<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopekAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-right: 1px solid #2f2f2f;
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      margin-bottom: 12px;
    }

    .logo-area img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    .logo-area span {
      font-weight: 600;
      font-size: 16px;
    }

    .new-chat {
      background: transparent;
      border: 1px solid #4d4d4f;
      color: #ececec;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      margin-bottom: 16px;
      transition: background 0.15s;
    }
    .new-chat:hover { background: #2f2f2f; }

    /* ===== MUSIC PLAYER ===== */
    .player {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 14px;
      margin-top: auto;
    }

    .player-title {
      font-size: 12px;
      color: #8e8e8e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .now-playing {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap { margin-bottom: 10px; }

    .progress-bar {
      height: 4px;
      background: #444;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #10a37f;
      border-radius: 2px;
      width: 0%;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8e8e8e;
      margin-top: 4px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .player-btn {
      background: transparent;
      border: none;
      color: #ececec;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .player-btn:hover { background: #3a3a3a; }
    .player-btn.play {
      background: #10a37f;
      width: 42px;
      height: 42px;
    }
    .player-btn.play:hover { background: #0d8c6c; }

    .track-list {
      margin-top: 12px;
      max-height: 140px;
      overflow-y: auto;
      font-size: 12px;
    }

    .track-item {
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #b0b0b0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item:hover { background: #333; color: #fff; }
    .track-item.active { background: #10a37f33; color: #10a37f; }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #2f2f2f;
      font-size: 14px;
      color: #8e8e8e;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      max-width: 768px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px;
      display: flex;
      gap: 16px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .avatar.user {
      background: #5436da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .content {
      flex: 1;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .content img.reply-img {
      max-width: 320px;
      border-radius: 12px;
      margin-top: 12px;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .input-area {
      padding: 16px 24px 24px;
      max-width: 768px;
      margin: 0 auto;
      width: 100%;
    }

    .input-box {
      background: #2f2f2f;
      border-radius: 26px;
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
      gap: 12px;
      border: 1px solid #4d4d4f;
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #ececec;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
    }

    .send-btn {
      background: #ececec;
      color: #0d0d0d;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #8e8e8e;
      padding: 8px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #8e8e8e;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo-area">
      <img src="photo21.png" alt="Logo">
      <span>PopekAI</span>
    </div>
    <button class="new-chat" onclick="clearChat()">+ Nowa rozmowa</button>

    <!-- MUSIC PLAYER -->
    <div class="player">
      <div class="player-title">Music Player</div>
      <div class="now-playing" id="nowPlaying">—</div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="player-btn" onclick="prevTrack()" title="Poprzedni">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="player-btn play" id="playBtn" onclick="togglePlay()" title="Play/Pause">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="player-btn" onclick="nextTrack()" title="Następny">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="track-list" id="trackList"></div>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      PopekAI • powered by Groq
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Napisz wiadomość do PopekAI..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="footer">
        PopekAI może popełniać błędy. Sprawdź ważne informacje.
      </div>
    </div>
  </div>

  <script>
    // ========== GROQ API ==========
    const GROQ_API_KEY = "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";
    const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
    const MODEL = "openai/gpt-oss-120b";

    // ========== MUSIC ==========
    const musicFiles = [
      'https://xxxpawelpopekxxx.github.io/music.mp3',
      'https://xxxpawelpopekxxx.github.io/music2.mp3',
      'https://xxxpawelpopekxxx.github.io/music3.mp3',
      'https://xxxpawelpopekxxx.github.io/music4.mp3',
      'https://xxxpawelpopekxxx.github.io/music5.mp3',
      'https://xxxpawelpopekxxx.github.io/music6.mp3',
      'https://xxxpawelpopekxxx.github.io/music7.mp3',
      'https://xxxpawelpopekxxx.github.io/music8.mp3'
    ];

    const trackNames = musicFiles.map((url, i) => `Track ${i + 1}`);
    let currentTrack = 0;
    let audio = new Audio();
    audio.volume = 0.5;

    function initPlayer() {
      const list = document.getElementById('trackList');
      trackNames.forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'track-item' + (i === 0 ? ' active' : '');
        div.textContent = name;
        div.onclick = () => playTrack(i);
        list.appendChild(div);
      });
      loadTrack(0);
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('ended', nextTrack);
      audio.addEventListener('loadedmetadata', () => {
        document.getElementById('duration').textContent = formatTime(audio.duration);
      });
    }

    function loadTrack(index) {
      currentTrack = index;
      audio.src = musicFiles[index];
      document.getElementById('nowPlaying').textContent = trackNames[index];
      document.querySelectorAll('.track-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('currentTime').textContent = '0:00';
    }

    function playTrack(index) {
      loadTrack(index);
      audio.play().catch(() => {});
      updatePlayIcon(true);
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().catch(() => {});
        updatePlayIcon(true);
      } else {
        audio.pause();
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(playing) {
      const icon = document.getElementById('playIcon');
      if (playing) {
        icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function nextTrack() {
      playTrack((currentTrack + 1) % musicFiles.length);
    }

    function prevTrack() {
      playTrack((currentTrack - 1 + musicFiles.length) % musicFiles.length);
    }

    function updateProgress() {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    }

    function seek(e) {
      const bar = document.getElementById('progressBar');
      const rect = bar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // ========== CHAT ==========
    let conversation = [
      { role: "system", content: "Jesteś PopekAI – luźny, wyluzowany asystent. Odpowiadaj po polsku, krótko i naturalnie." }
    ];

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // losuje photo1.png … photo20.png
    function getRandomPhoto() {
      const num = Math.floor(Math.random() * 20) + 1;
      return `photo${num}.png`;
    }

    function addMessage(text, isUser = false, showImage = false) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message';

      if (isUser) {
        div.innerHTML = `
          <div class="avatar user">Ty</div>
          <div class="content">${escapeHtml(text)}</div>
        `;
      } else {
        const imgHtml = showImage
          ? `<img class="reply-img" src="${getRandomPhoto()}" alt="odpowiedź">`
          : '';
        div.innerHTML = `
          <img class="avatar" src="photo21.png" alt="AI">
          <div class="content">
            ${escapeHtml(text)}
            ${imgHtml}
          </div>
        `;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function showTyping() {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message';
      div.id = 'typing';
      div.innerHTML = `
        <img class="avatar" src="photo21.png" alt="AI">
        <div class="content">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      input.style.height = 'auto';

      document.getElementById('sendBtn').disabled = true;
      showTyping();

      conversation.push({ role: "user", content: text });

      try {
        // proxy omija CORS
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(GROQ_URL);

        const res = await fetch(proxyUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: MODEL,
            messages: conversation,
            temperature: 0.7,
            max_tokens: 2048
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error("Groq API error " + res.status + ": " + errText);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || "Nie dostałem odpowiedzi.";

        conversation.push({ role: "assistant", content: reply });
        removeTyping();
        addMessage(reply, false, true); // + losowe photo1–20
      } catch (err) {
        removeTyping();
        addMessage("Coś poszło nie tak: " + err.message, false, false);
        console.error(err);
      }

      document.getElementById('sendBtn').disabled = false;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function clearChat() {
      document.getElementById('messages').innerHTML = '';
      conversation = [
        { role: "system", content: "Jesteś PopekAI – luźny, wyluzowany asystent. Odpowiadaj po polsku, krótko i naturalnie." }
      ];
      setTimeout(() => {
        addMessage("Cześć, jestem PopekAI. O co chcesz zapytać?", false, false);
      }, 200);
    }

    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // start
    initPlayer();
    setTimeout(() => {
      addMessage("Cześć, jestem PopekAI. O co chcesz zapytać?", false, false);
    }, 300);
  </script>
</body>
</html>
