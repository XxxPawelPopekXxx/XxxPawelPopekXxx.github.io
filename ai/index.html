<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopekAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #171717;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-right: 1px solid #2f2f2f;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      margin-bottom: 16px;
    }

    .logo-area img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    .logo-area span {
      font-weight: 600;
      font-size: 16px;
    }

    .new-chat {
      background: transparent;
      border: 1px solid #4d4d4f;
      color: #ececec;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      margin-bottom: 12px;
      transition: background 0.15s;
    }

    .new-chat:hover {
      background: #2f2f2f;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      color: #8e8e8e;
      padding: 8px 4px;
    }

    /* Main chat */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #2f2f2f;
      font-size: 14px;
      color: #8e8e8e;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      max-width: 768px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px;
      display: flex;
      gap: 16px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .avatar.user {
      background: #5436da;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .content {
      flex: 1;
      line-height: 1.6;
      font-size: 15px;
    }

    .content img {
      max-width: 320px;
      border-radius: 12px;
      margin-top: 12px;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 24px;
      max-width: 768px;
      margin: 0 auto;
      width: 100%;
    }

    .input-box {
      background: #2f2f2f;
      border-radius: 26px;
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
      gap: 12px;
      border: 1px solid #4d4d4f;
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #ececec;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
    }

    .send-btn {
      background: #ececec;
      color: #0d0d0d;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #8e8e8e;
      padding: 8px;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #8e8e8e;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo-area">
      <img src="image21.png" alt="Logo">
      <span>PopekAI</span>
    </div>
    <button class="new-chat" onclick="clearChat()">+ Nowa rozmowa</button>
    <div class="history">
      Twoje rozmowy pojawią się tutaj...<br><br>
      (ale coś tu nie pasuje?)
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      PopekAI • model 67-ai-v676767
    </div>

    <div class="messages" id="messages">
      <!-- wiadomości będą tu -->
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Wyślij wiadomość do ChatGPT..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="footer">
        PopekAI nie może popełniać błędów. Sprawdź ważne informacje. (albo nie)
      </div>
    </div>
  </div>

  <script>
    const musicFiles = [
      'https://xxxpawelpopekxxx.github.io/music.mp3',
      'https://xxxpawelpopekxxx.github.io/music2.mp3',
      'https://xxxpawelpopekxxx.github.io/music3.mp3',
      'https://xxxpawelpopekxxx.github.io/music4.mp3',
      'https://xxxpawelpopekxxx.github.io/music5.mp3',
      'https://xxxpawelpopekxxx.github.io/music6.mp3',
      'https://xxxpawelpopekxxx.github.io/music7.mp3',
      'https://xxxpawelpopekxxx.github.io/music8.mp3'
    ];

    let currentAudio = null;

    function playRandomMusic() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      const track = musicFiles[Math.floor(Math.random() * musicFiles.length)];
      currentAudio = new Audio(track);
      currentAudio.volume = 0.35;
      currentAudio.play().catch(() => {}); // przeglądarka czasem blokuje autoplay
    }

    function addMessage(text, isUser = false, showImage = false) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message';

      if (isUser) {
        div.innerHTML = `
          <div class="avatar user">Ty</div>
          <div class="content">${escapeHtml(text)}</div>
        `;
      } else {
        let imgHtml = showImage ? `<img src="photo-photo20.png" alt="odpowiedź AI">` : '';
        div.innerHTML = `
          <img class="avatar" src="photo21.png" alt="AI">
          <div class="content">
            ${escapeHtml(text)}
            ${imgHtml}
          </div>
        `;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message';
      div.id = 'typing';
      div.innerHTML = `
        <img class="avatar" src="image21.png" alt="AI">
        <div class="content">
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      input.style.height = 'auto';

      document.getElementById('sendBtn').disabled = true;
      showTyping();

      // trochę delayu jak prawdziwy AI
      setTimeout(() => {
        removeTyping();
        const answer = Math.random() > 0.5 ? "Tak" : "Nie";
        addMessage(answer, false, true);
        playRandomMusic();
        document.getElementById('sendBtn').disabled = false;
      }, 800 + Math.random() * 1200);
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function clearChat() {
      document.getElementById('messages').innerHTML = '';
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    // auto-resize textarea
    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // powitanie
    setTimeout(() => {
      addMessage("Cześć. Zadaj pytanie. Odpowiem Ci na twoje pytanie!", false, false);
    }, 400);
  </script>
</body>
</html>
