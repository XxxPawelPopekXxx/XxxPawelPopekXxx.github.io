<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawel Popek Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f7f8fc;
            color: #1a1a1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            letter-spacing: 0.01em;
        }

        .container {
            text-align: center;
            padding: 2.5rem 1.5rem;
            max-width: 440px;
            width: 100%;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #111;
            letter-spacing: 0.04em;
        }

        .accent {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
            margin: 0.6rem auto 2.4rem auto;
            border-radius: 3px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        a.btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 1.05rem 1.4rem;
            background: #ffffff;
            border: 1.5px solid #e8e8ef;
            color: #222;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.22s ease;
        }

        a.btn:hover {
            border-color: #d0d0e0;
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        a.btn:active {
            transform: translateY(-1px);
        }

        .emoji {
            font-size: 1.35rem;
            line-height: 1;
        }

        .footer {
            margin-top: 2.8rem;
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 0.04em;
        }

        .footer span {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paweł Popek Portal ✨</h1>
        <div class="accent"></div>

        <div class="buttons">
            <a class="btn" href="http://pawelpopek.baby/rng" target="_blank" rel="noopener">
                <span class="emoji">🎲</span> PopekRNG
            </a>
            <a class="btn" href="http://pawelpopek.baby/PopekTok/" target="_blank" rel="noopener">
                <span class="emoji">📱</span> PopekTok
            </a>
            <a class="btn" href="http://pawelpopek.baby/kasyno" target="_blank" rel="noopener">
                <span class="emoji">🎰</span> PopekKasyno
            </a>
            <a class="btn" href="http://pawelpopek.baby/ai/" target="_blank" rel="noopener">
                <span class="emoji">🤖</span> PopekAI
            </a>
            <a class="btn" href="http://pawelpopek.baby/chess/" target="_blank" rel="noopener">
                <span class="emoji">♟️</span> PopekChess
            </a>
        </div>

        <div class="footer">
            <span>🌈</span> filip jest gejem
        </div>
    </div>
</body>
</html>
