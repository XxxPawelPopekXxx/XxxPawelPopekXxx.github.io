<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paweł</title>
    <style>
        /* Reset all margins and paddings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full viewport black background */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Image container: forces full screen */
        .image-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Image takes full screen, stretched if needed */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            object-fit: fill;    /* stretches to fill exactly */
            display: block;
            background: #0a0a0a; /* fallback */
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Optional subtle overlay to hint at fullscreen (totally optional) */
        .hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.2);
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 999;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="photo.png" alt="Full screen image" class="fullscreen-image" />
    </div>
    <div class="hint">⛶ its4iko copyrighted</div>
</body>
</html>
