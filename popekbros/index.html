<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopekBros - Fullscreen Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            display: flex;
            gap: 40px;
            z-index: 10;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #fff;
        }
        #screenMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 4px 4px 0px #000;
            text-align: center;
            display: none;
            z-index: 20;
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #fff;
            color: white;
        }
        button {
            padding: 12px 30px;
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            background-color: #ff5722;
            color: white;
            border: 3px solid white;
            border-radius: 8px;
            box-shadow: 0 5px 0 #b33600;
            transition: 0.1s;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-box">GRA: <span style="color: #ff5722;">PopekBros</span></div>
    <div class="stat-box">ŻYCIA: <span id="livesVal" style="color: #ff4757;">5</span></div>
    <div class="stat-box">MONETY: <span id="scoreVal" style="color: #ffa502;">0</span></div>
</div>

<div id="screenMessage">
    <div id="msgText"></div>
    <button onclick="resetGame()">Zagraj ponownie</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const livesVal = document.getElementById("livesVal");
const scoreVal = document.getElementById("scoreVal");
const screenMessage = document.getElementById("screenMessage");
const msgText = document.getElementById("msgText");

// Dopasowanie do pełnego ekranu
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Ładowanie zdjęcia gracza
const playerImg = new Image();
playerImg.src = 'photo1.png'; 
let imgLoaded = false;
playerImg.onload = () => { imgLoaded = true; };

// Fizyka
const GRAVITY = 0.6;
const PLAYER_SPEED = 6;
const JUMP_FORCE = -14;

let player = {
    x: 100,
    y: 100,
    width: 50,
    height: 50,
    velX: 0,
    velY: 0,
    grounded: false,
    lives: 5,
    score: 0
};

let cameraX = 0;
let keys = {};
let gameOver = false;
let coinAnimTimer = 0;

const tileSize = 50; // Większe kafelki dla lepszej widoczności

// DUŻA MAPA (Inspirowana światem Mario)
// T = Ziemia/Trawa, B = Cegła, M = Blok ze znakiem zapytania, P = Rura, C = Moneta, F = Flaga (Meta)
const mapLayout = [
    "                                                                                                                                                                ",
    "                                                                                                                                                                ",
    "                                                                                                                                                                ",
    "                                                                                                                                                                ",
    "                                                                   C C C                                                                                        ",
    "                             C C                                  BBBBBBB                                                   BBBBBB                              ",
    "                            BBBBB                                                                                                                               ",
    "                                           M B M B M                                            C  C  C                                                         ",
    "                                                                                               BBBBBBBB                                                         ",
    "                 M B M                                       C   C                                                     BB      BB                               ",
    "                                                            BB   BB                                                   BBB      BBB                              ",
    "                                           C   C           BBB   BBB           P                                     BBBB      BBBB                           F ",
    "         P               C   C            TT   TT         BBBB   BBBB          P              P                     BBBBB      BBBBB                         TT ",
    "TTTTTTTTTTTTTTTTTT      TTTTTTT          TTTT TTTT       TTTTT   TTTTT      TTTTTTTT      TTTTTTTTT      TTTTT     TTTTTT      TTTTTT      TTTTTTTTTTTTTTTTTTTTT",
    "TTTTTTTTTTTTTTTTTTGGGGGGTTTTTTTGGGGGGGGGGTTTT TTTTGGGGGGGTTTTT   TTTTTGGGGGGTTTTTTTTGGGGGGTTTTTTTTTGGGGGGTTTTTGGGGGTTTTTTGGGGGGTTTTTTGGGGGGTTTTTTTTTTTTTTTTTTTTT"
];

let platforms = [];
let coins = [];
let finishLine = null;

function parseMap() {
    platforms = [];
    coins = [];
    
    // Obliczanie dynamicznego poziomu gruntu na podstawie wysokości ekranu
    const totalMapRows = mapLayout.length;
    const startY = canvas.height - (totalMapRows * tileSize);

    for (let r = 0; r < mapLayout.length; r++) {
        for (let c = 0; c < mapLayout[r].length; c++) {
            let type = mapLayout[r][c];
            let x = c * tileSize;
            let y = startY + (r * tileSize);

            if (type === 'T') {
                platforms.push({ x, y, width: tileSize, height: tileSize, type: 'grass' });
            } else if (type === 'G') {
                platforms.push({ x, y, width: tileSize, height: tileSize, type: 'dirt' });
            } else if (type === 'B') {
                platforms.push({ x, y, width: tileSize, height: tileSize, type: 'brick' });
            } else if (type === 'M') {
                platforms.push({ x, y, width: tileSize, height: tileSize, type: 'lucky' });
            } else if (type === 'P') {
                platforms.push({ x, y, width: tileSize, height: tileSize * 2, type: 'pipe' });
            } else if (type === 'C') {
                coins.push({ x: x + 12, y: y + 12, width: 26, height: 26, collected: false });
            } else if (type === 'F') {
                finishLine = { x: x + 20, y: y - tileSize * 4, width: 10, height: tileSize * 5 };
            }
        }
    }
}

// Sterowanie
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function update() {
    if (gameOver) return;

    coinAnimTimer += 0.1;

    // Ruch w lewo/prawo
    if (keys["ArrowRight"] || keys["KeyD"]) {
        if (player.velX < PLAYER_SPEED) player.velX += 0.8;
    } else if (keys["ArrowLeft"] || keys["KeyA"]) {
        if (player.velX > -PLAYER_SPEED) player.velX -= 0.8;
    } else {
        player.velX *= 0.75;
    }

    // Skok
    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
        player.velY = JUMP_FORCE;
        player.grounded = false;
    }

    player.velY += GRAVITY;
    player.x += player.velX;
    player.y += player.velY;

    if (player.x < 0) player.x = 0;
    player.grounded = false;

    // Kolizje z platformami
    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            let distX = (player.x + player.width / 2) - (plat.x + plat.width / 2);
            let distY = (player.y + player.height / 2) - (plat.y + plat.height / 2);
            let widthSum = (player.width + plat.width) / 2;
            let heightSum = (player.height + plat.height) / 2;

            if (Math.abs(distX) < widthSum && Math.abs(distY) < heightSum) {
                let overlapX = widthSum - Math.abs(distX);
                let overlapY = heightSum - Math.abs(distY);

                if (overlapX >= overlapY) {
                    if (distY > 0) { 
                        player.y += overlapY;
                        player.velY = 0;
                    } else { 
                        player.y -= overlapY;
                        player.grounded = true;
                        player.velY = 0;
                    }
                } else {
                    if (distX > 0) player.x += overlapX;
                    else player.x -= overlapX;
                }
            }
        }
    }

    // Monety
    for (let coin of coins) {
        if (!coin.collected && checkCollision(player, coin)) {
            coin.collected = true;
            player.score++;
            scoreVal.innerText = player.score;
        }
    }

    // Meta
    if (finishLine && checkCollision(player, finishLine)) {
        endGame(true);
    }

    // Spadek w przepaść
    if (player.y > canvas.height + 100) {
        player.lives--;
        livesVal.innerText = player.lives;
        if (player.lives <= 0) {
            endGame(false);
        } else {
            player.x = Math.max(100, cameraX + 50); 
            player.y = 100;
            player.velX = 0;
            player.velY = 0;
        }
    }

    // Płynna kamera podążająca za graczem
    let targetCameraX = player.x - canvas.width / 3;
    if (targetCameraX < 0) targetCameraX = 0;
    cameraX += (targetCameraX - cameraX) * 0.1; // Efekt opóźnienia (smooth camera)
}

function draw() {
    // 1. ŁADNE TŁO - Gradient nieba (Ulepszona grafika)
    let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGradient.addColorStop(0, "#1e90ff");
    skyGradient.addColorStop(0.6, "#70a1ff");
    skyGradient.addColorStop(1, "#a4b0be");
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 2. RYSOWANIE PLATFORM Z TEKSTURAMI WEKTOROWYMI
    for (let plat of platforms) {
        if (plat.type === 'grass') {
            // Trawa (Jasny zielony wierzch, ciemniejszy dół)
            ctx.fillStyle = "#2ed573";
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            ctx.fillStyle = "#26af5f";
            ctx.fillRect(plat.x, plat.y + 12, plat.width, plat.height - 12);
        } 
        else if (plat.type === 'dirt') {
            // Ziemia pod trawą
            ctx.fillStyle = "#747d8c";
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        } 
        else if (plat.type === 'brick') {
            // Cegły w stylu Mario
            ctx.fillStyle = "#ff6b81";
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            ctx.strokeStyle = "#400000";
            ctx.lineWidth = 2;
            ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
            // Linie cegieł
            ctx.beginPath();
            ctx.moveTo(plat.x, plat.y + tileSize/2); ctx.lineTo(plat.x + tileSize, plat.y + tileSize/2);
            ctx.moveTo(plat.x + tileSize/2, plat.y); ctx.lineTo(plat.x + tileSize/2, plat.y + tileSize/2);
            ctx.moveTo(plat.x + tileSize/4, plat.y + tileSize/2); ctx.lineTo(plat.x + tileSize/4, plat.y + tileSize);
            ctx.stroke();
        } 
        else if (plat.type === 'lucky') {
            // Blok "?" 
            ctx.fillStyle = "#ffa502";
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            ctx.strokeStyle = "#fff";
            ctx.strokeRect(plat.x + 3, plat.y + 3, plat.width - 6, plat.height - 6);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px Arial";
            ctx.fillText("?", plat.x + 18, plat.y + 32);
        } 
        else if (plat.type === 'pipe') {
            // Zielona rura
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            ctx.fillStyle = "#27ae60"; // Cień rury
            ctx.fillRect(plat.x + plat.width - 15, plat.y, 15, plat.height);
            ctx.strokeStyle = "#1e6b39";
            ctx.lineWidth = 3;
            ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
        }
    }

    // 3. ANIMOWANE I BŁYSZCZĄCE MONETY
    for (let coin of coins) {
        if (!coin.collected) {
            let pulse = Math.sin(coinAnimTimer) * 4; // Efekt obracania/pulsowania
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.ellipse(coin.x + coin.width/2, coin.y + coin.height/2, Math.max(2, coin.width/2 + pulse), coin.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    // 4. MASZT I FLAGA METY
    if (finishLine) {
        ctx.fillStyle = "#f1f2f6";
        ctx.fillRect(finishLine.x, finishLine.y, finishLine.width, finishLine.height);
        // Flaga z pulsującym kolorem
        ctx.fillStyle = "#ff4757";
        ctx.beginPath();
        ctx.moveTo(finishLine.x + finishLine.width, finishLine.y);
        ctx.lineTo(finishLine.x + finishLine.width + 40, finishLine.y + 25);
        ctx.lineTo(finishLine.x + finishLine.width, finishLine.y + 50);
        ctx.fill();
    }

    // 5. GRACZ (Z Twojego zdjęcia lub ładny zamiennik)
    if (imgLoaded) {
        // Cień pod graczem dla lepszego efektu 3D w grafice
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.fillRect(player.x, player.y + player.height - 5, player.width, 5);
        
        ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
    } else {
        // Ulepszony awaryjny model gracza z gradientem
        let playerGrad = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.height);
        playerGrad.addColorStop(0, "#ff6b81");
        playerGrad.addColorStop(1, "#ff4757");
        ctx.fillStyle = playerGrad;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(player.x, player.y, player.width, player.height);
    }

    ctx.restore();
}

function endGame(victory) {
    gameOver = true;
    screenMessage.style.display = "block";
    if (victory) {
        msgText.innerHTML = "WYGRAŁEŚ!<br><span style='font-size:24px;color:#2ed573;'>Ukończyłeś wielką mapę PopekBros!</span>";
    } else {
        msgText.innerHTML = "GAME OVER<br><span style='font-size:24px;color:#ff4757;'>Skończyły Ci się życia.</span>";
    }
}

function resetGame() {
    player.x = 100;
    player.y = 100;
    player.velX = 0;
    player.velY = 0;
    player.lives = 5;
    player.score = 0;
    player.grounded = false;
    cameraX = 0;
    gameOver = false;
    
    livesVal.innerText = player.lives;
    scoreVal.innerText = player.score;
    screenMessage.style.display = "none";
    
    parseMap();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Start gry po załadowaniu okna (aby poprawnie obliczyć rozmiar ekranu)
window.onload = () => {
    resizeCanvas();
    parseMap();
    gameLoop();
};
</script>

</body>
</html>
